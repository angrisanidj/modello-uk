name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate partial raking model
        run: python tools/build_backtest.py

      - name: Validate datasets
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          backtest=load("data/backtest-2024-territorial.json")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          n_polls=len(polls.get("polls",[])); n_const=len(constituencies.get("constituencies",[])); regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[]); ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}; target=ni.get("target_shares",{})
          base_hold=backtest.get("baseline_common",{}).get("holdout_2024",{})
          partial=backtest.get("partial_raking_candidate",{}); val=partial.get("validation_2019",{}); hold=partial.get("holdout_2024",{})

          print(f"National polls: {n_polls}")
          print(f"Constituencies: {n_const}")
          print(f"GB model: {params.get('version')} approved={params.get('approved')}")
          print(f"NI version: {ni.get('meta',{}).get('version')}")
          print(f"NI seats: {len(ni_seats)}")
          print(f"NI winners 2024: {dict(ni_winners)}")
          print(f"NI signal weight: {ni.get('meta',{}).get('signal_weight')}")
          print(f"NI weak target: {target}")

          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected GB model version {params.get('version')}")
          if base_hold.get("gb_seats")!=632 or val.get("gb_seats")!=632 or hold.get("gb_seats")!=632: raise SystemExit("ERROR: GB backtest did not evaluate 632 seats")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18: raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected}!=expected: raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")
          if abs(sum(float(v) for v in target.values())-100)>.05: raise SystemExit("ERROR: NI target does not sum to 100")
          if abs(float(ni.get("meta",{}).get("signal_weight",0))-.25)>1e-9: raise SystemExit("ERROR: unexpected NI signal weight")

          print("Dataset validation passed.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data, NI module and backtest"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
