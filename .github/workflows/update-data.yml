name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.16 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.16 — local-strength refinement sweep",
              "builder_integrity":"bes-integrity-v0916.json",
              "app":"uk-v0916-20260827-local-strength-refinement",
              "index":"Versione 0.9.16 · local strength refinement",
          }
          observed={"builder":builder,"builder_integrity":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.16 (missing {needle!r})")
          print("v0.9.16 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.16 local-strength refinement sweep
        run: python tools/build_mrp_lite.py

      - name: Validate BES integrity and v0.9.16 safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v0916.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0916-local-refinement.json")
          errors=load("data/error-structure-v0916.json")
          sweep=load("data/local-strength-refinement-v0916.json")

          n_polls=len(polls.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}
          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18: raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni: raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0916-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632: raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True: raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0916-local-strength-refinement",
              "live":"uk-v0916-local-strength-refinement-live",
              "backtest":"uk-v0916-local-strength-refinement-backtest",
              "errors":"uk-v0916-local-strength-refinement",
              "sweep":"uk-v0916-local-strength-refinement",
          }
          observed_versions={"model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),"errors":errors.get("version"),"sweep":sweep.get("version")}
          if observed_versions!=expected_versions: raise SystemExit(f"ERROR: unexpected v0.9.16 versions {observed_versions}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("errors",errors),("sweep",sweep)):
              if payload.get("status")!="ok": raise SystemExit(f"ERROR: v0.9.16 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-local-strength-refinement-v10": raise SystemExit(f"ERROR: unexpected model type {mrp.get('model_type')}")
          if live.get("model_type")!="constituency-residual-local-strength-refinement-v10": raise SystemExit("ERROR: live shadow model type mismatch")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest)):
              if payload.get("shadow_only") is not True or payload.get("diagnostic_only") is not True: raise SystemExit(f"ERROR: {label} is not shadow diagnostic research")
              if payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False: raise SystemExit(f"ERROR: {label} claims to change canonical/production model")
          if mrp.get("approved") is not False or live.get("approved") is not False: raise SystemExit("ERROR: v0.9.16 shadow research cannot be approved")
          if mrp.get("publication_ready") is not False or live.get("publication_ready") is not False: raise SystemExit("ERROR: v0.9.16 shadow research cannot be publication-ready")

          strengths=mrp.get("selected_party_strengths") or {}
          required={"lab","con","ref","ld","green","snp","pc","other"}
          if not required.issubset(strengths): raise SystemExit(f"ERROR: incomplete party strengths {strengths}")
          routing=mrp.get("selected_incumbent_routing") or {}
          if abs(float(routing.get("route_strength") or 0))>1e-12 or abs(float(routing.get("unwind_strength") or 0))>1e-12:
              raise SystemExit(f"ERROR: rejected incumbent routing reactivated {routing}")

          # Hard freeze: external local signals live only in the shadow sweep.
          val=mrp.get("validation_2019",{}).get("candidate",{});hold=mrp.get("holdout_2024",{}).get("candidate",{})
          expected_2019={"correct_winners":583,"seat_abs_error_sum":42};expected_2024={"correct_winners":494,"seat_abs_error_sum":176}
          if {k:val.get(k) for k in expected_2019}!=expected_2019: raise SystemExit(f"ERROR: v0.9.16 changed canonical 2019: {val}")
          if {k:hold.get(k) for k in expected_2024}!=expected_2024: raise SystemExit(f"ERROR: v0.9.16 changed canonical 2024: {hold}")
          if hold.get("predicted_seats",{}).get("ref")!=39 or hold.get("actual_seats",{}).get("ref")!=5: raise SystemExit("ERROR: canonical Reform regression guard failed")

          if errors.get("total_seats")!=632 or errors.get("wrong_seats")!=138 or errors.get("correct_seats")!=494: raise SystemExit("ERROR: incomplete canonical error audit")
          if len(errors.get("wrong_constituencies",[]))!=138: raise SystemExit("ERROR: wrong constituency list does not contain 138 cases")

          # Leakage / fixed-grid gates.
          if sweep.get("uses_2024_for_parameter_selection") is not False: raise SystemExit("ERROR: v0.9.16 leaks 2024 into parameter selection")
          if sweep.get("parameter_selection_election")!="2019": raise SystemExit(f"ERROR: unexpected selection election {sweep.get('parameter_selection_election')}")
          if sweep.get("candidate_count")!=81: raise SystemExit(f"ERROR: expected 81 fixed local-refinement candidates, got {sweep.get('candidate_count')}")
          grid=sweep.get("grid",{})
          if grid.get("local_strength")!=[0.0,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.5]: raise SystemExit(f"ERROR: unexpected local-strength grid {grid}")
          if grid.get("confidence_floor")!=[0.0,0.35,0.55] or grid.get("margin_cap")!=[None,15.0,25.0]: raise SystemExit(f"ERROR: unexpected reliability grid {grid}")
          if float(grid.get("byelection_strength_fixed",-1))!=0.0: raise SystemExit(f"ERROR: by-election strength was reactivated {grid}")
          temporal=sweep.get("temporal_policy",{})
          if temporal.get("validation_2019",{}).get("cutoff")!="2019-12-12" or temporal.get("benchmark_2024",{}).get("cutoff")!="2024-07-04": raise SystemExit(f"ERROR: temporal cutoffs changed {temporal}")
          if max(temporal.get("validation_2019",{}).get("local_dates",["9999"]))>="2019-12-12": raise SystemExit("ERROR: 2019 local source crosses election cutoff")
          if max(temporal.get("benchmark_2024",{}).get("local_dates",["9999"]))>="2024-07-04": raise SystemExit("ERROR: 2024 local source crosses election cutoff")

          baseline=sweep.get("baseline",{})
          if baseline.get("validation_2019",{}).get("correct_winners")!=583 or baseline.get("validation_2019",{}).get("seat_abs_error_sum")!=42: raise SystemExit("ERROR: sweep 2019 baseline mismatch")
          if baseline.get("benchmark_2024",{}).get("correct_winners")!=494 or baseline.get("benchmark_2024",{}).get("seat_abs_error_sum")!=176: raise SystemExit("ERROR: sweep 2024 baseline mismatch")
          ref=sweep.get("v0915_reference",{})
          rv=ref.get("validation_2019",{});rh=ref.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: v0.9.15 reference 2019 not reproduced {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166: raise SystemExit(f"ERROR: v0.9.15 reference 2024 not reproduced {rh}")

          coverage=sweep.get("coverage",{})
          c19=int(coverage.get("local_2019",{}).get("matched_seats") or 0);c24=int(coverage.get("local_2024",{}).get("matched_seats") or 0)
          if c19<300 or c24<300: raise SystemExit(f"ERROR: local-election coverage too low 2019={c19} 2024={c24}")
          sources=sweep.get("sources",{})
          for k in ("local_2019","local_2024","ons_2019","ons_2024"):
              if not isinstance(sources.get(k),dict): raise SystemExit(f"ERROR: missing source audit {k}")

          selected=sweep.get("selected_pre2024",{});sv=selected.get("validation_2019",{});sh=selected.get("benchmark_2024",{})
          if sv.get("gb_seats")!=632 or sh.get("gb_seats")!=632: raise SystemExit("ERROR: selected local candidate not scored on 632 GB seats")
          # The zero/zero candidate is in the grid, so selection cannot be worse on the 2019 score order.
          if int(sv.get("correct_winners") or 0)<583: raise SystemExit(f"ERROR: 2019 selector chose lower accuracy candidate {sv}")
          if int(sv.get("correct_winners") or 0)==583 and int(sv.get("seat_abs_error_sum") or 999)>42: raise SystemExit(f"ERROR: 2019 selector lost canonical tie-break {sv}")
          ranking=sweep.get("benchmark_2024_diagnostic",{}).get("ranking",[])
          if len(ranking)!=81 or any(x.get("benchmark_2024",{}).get("gb_seats")!=632 for x in ranking): raise SystemExit("ERROR: incomplete fixed-grid 2024 diagnostic")

          print("2019 canonical regression guard: PASSED",expected_2019)
          print("2024 canonical regression guard: PASSED",expected_2024)
          print("Local-election constituency coverage:",c19,c24)
          print("By-election layer: FIXED AT ZERO")
          print("v0.9.16 selected on 2019 ONLY:",selected.get("id"))
          print("Selected 2019:",sv)
          print("Selected 2024 score-only benchmark:",sh)
          print("Selected research gate (>=506 correct and seat error <=166):",selected.get("research_gate"))
          print("Best fixed-grid 2024 diagnostic (NOT selectable):",sweep.get("benchmark_2024_diagnostic",{}).get("best_expost"))
          print("2024 research-gate passers (diagnostic only):",sweep.get("benchmark_2024_diagnostic",{}).get("passing_research_gate",[]))
          print("Largest canonical 2024 error pair:",errors.get("largest_error_pair"))
          print("Dataset/model validation passed. v0.9.16 remains SHADOW RESEARCH ONLY.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.16 local strength refinement"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
