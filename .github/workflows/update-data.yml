name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Build v0.9.13 Reform structural sweep (shadow research)
        run: python tools/build_mrp_lite.py

      - name: Validate BES integrity and v0.9.13 safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v0913.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0913-reform-structural-sweep.json")
          diagnostic=load("data/reform-diagnostics-v0913.json")
          sweep=load("data/reform-structural-sweep-v0913.json")

          n_polls=len(polls.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}

          if n_polls<10:
              raise SystemExit("ERROR: too few national polls")
          if n_const!=650:
              raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650:
              raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9:
              raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking":
              raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency":
              raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18:
              raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni:
              raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0913-bes-integrity":
              raise SystemExit(f"ERROR: unexpected integrity version {integrity.get('version')}")
          if integrity.get("status")!="passed":
              raise SystemExit("ERROR: BES integrity failed: "+str(integrity.get("errors")))
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0913-reform-structural-sweep",
              "live":"uk-v0913-reform-structural-sweep-live",
              "backtest":"uk-v0913-reform-structural-sweep-backtest",
              "diagnostic":"uk-v0913-reform-structural-sweep",
              "sweep":"uk-v0913-reform-structural-sweep",
          }
          observed_versions={
              "model":mrp.get("version"),"live":live.get("version"),
              "backtest":backtest.get("version"),"diagnostic":diagnostic.get("version"),
              "sweep":sweep.get("version"),
          }
          if observed_versions!=expected_versions:
              raise SystemExit(f"ERROR: unexpected v0.9.13 versions {observed_versions}")

          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("diagnostic",diagnostic),("sweep",sweep)):
              if payload.get("status")!="ok":
                  raise SystemExit(f"ERROR: v0.9.13 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-reform-structural-sweep-v7":
              raise SystemExit(f"ERROR: unexpected model type {mrp.get('model_type')}")
          if live.get("model_type")!="constituency-residual-reform-structural-sweep-v7":
              raise SystemExit("ERROR: live shadow model type mismatch")

          # v0.9.13 is research-only. It must not change or promote the candidate model.
          for label,payload in (("model",mrp),("live",live),("backtest",backtest)):
              if payload.get("shadow_only") is not True:
                  raise SystemExit(f"ERROR: {label} is not shadow-only")
              if payload.get("diagnostic_only") is not True:
                  raise SystemExit(f"ERROR: {label} is not marked diagnostic-only")
              if payload.get("changes_production_model") is not False:
                  raise SystemExit(f"ERROR: {label} claims to change production")
              if payload.get("changes_candidate_model") is not False:
                  raise SystemExit(f"ERROR: {label} claims to change the canonical candidate")
          if mrp.get("approved") is not False or live.get("approved") is not False:
              raise SystemExit("ERROR: structural sweep cannot be approved")
          if mrp.get("publication_ready") is not False or live.get("publication_ready") is not False:
              raise SystemExit("ERROR: structural sweep cannot be publication-ready")
          if mrp.get("used_for_parameter_selection") is not False or sweep.get("used_for_parameter_selection") is not False:
              raise SystemExit("ERROR: 2024 sweep is incorrectly marked as parameter selection")

          donor=mrp.get("ref_latent_donor",{})
          if donor.get("donor_year")!="15" or donor.get("uses_2024") is not False:
              raise SystemExit(f"ERROR: invalid latent donor {donor}")
          if int(donor.get("training_seats") or 0)<450:
              raise SystemExit(f"ERROR: too few 2015 donor seats {donor}")

          calibration=mrp.get("ref_2019_calibration",{})
          if calibration.get("base_year")!="19":
              raise SystemExit(f"ERROR: calibration is not based on 2019 {calibration}")
          if calibration.get("uses_2024") is not False or calibration.get("parameter_tuning") is not False:
              raise SystemExit(f"ERROR: 2019 calibration leaks/tunes on 2024 {calibration}")
          if int(calibration.get("training_seats") or 0)<200:
              raise SystemExit(f"ERROR: too few observed 2019 Brexit seats for calibration {calibration}")

          strengths=mrp.get("selected_party_strengths") or {}
          required={"lab","con","ref","ld","green","snp","pc","other"}
          if not required.issubset(strengths):
              raise SystemExit(f"ERROR: incomplete party strengths {strengths}")
          routing=mrp.get("selected_incumbent_routing") or {}
          if abs(float(routing.get("route_strength") or 0))>1e-12 or abs(float(routing.get("unwind_strength") or 0))>1e-12:
              raise SystemExit(f"ERROR: rejected incumbent routing reactivated {routing}")

          val=mrp.get("validation_2019",{}).get("candidate",{})
          hold=mrp.get("holdout_2024",{}).get("candidate",{})
          expected_2019={"correct_winners":583,"seat_abs_error_sum":42}
          observed_2019={k:val.get(k) for k in expected_2019}
          if observed_2019!=expected_2019:
              raise SystemExit(f"ERROR: v0.9.13 changed 2019: expected={expected_2019} observed={observed_2019}")

          # Canonical 2024 candidate is deliberately frozen to v0.9.10/v0.9.11.
          expected_2024={"correct_winners":494,"seat_abs_error_sum":176}
          observed_2024={k:hold.get(k) for k in expected_2024}
          if observed_2024!=expected_2024:
              raise SystemExit(f"ERROR: v0.9.13 changed canonical 2024 candidate: expected={expected_2024} observed={observed_2024}")
          if hold.get("predicted_seats",{}).get("ref")!=39 or hold.get("actual_seats",{}).get("ref")!=5:
              raise SystemExit(f"ERROR: canonical Reform regression guard failed {hold.get('predicted_seats')} {hold.get('actual_seats')}")

          variants=sweep.get("variants",[])
          if len(variants)<11:
              raise SystemExit(f"ERROR: structural sweep incomplete: only {len(variants)} variants")
          by_id={v.get("id"):v for v in variants}
          required_ids={
              "baseline_v0910","raw_latent_v0912",
              "calibrated_all_half","calibrated_all_current","calibrated_all_strong",
              "calibrated_con_half","calibrated_con_current","calibrated_con_strong",
              "calibrated_all_norm_current","calibrated_con_norm_current","calibrated_con_norm_strong",
          }
          if not required_ids.issubset(by_id):
              raise SystemExit(f"ERROR: missing sweep variants {sorted(required_ids-set(by_id))}")
          baseline=by_id["baseline_v0910"].get("metrics",{})
          if baseline.get("correct_winners")!=494 or baseline.get("seat_abs_error_sum")!=176 or baseline.get("predicted_seats",{}).get("ref")!=39:
              raise SystemExit(f"ERROR: sweep baseline is not frozen v0.9.10 {baseline}")
          for vid,v in by_id.items():
              m=v.get("metrics",{})
              if m.get("gb_seats")!=632:
                  raise SystemExit(f"ERROR: sweep variant {vid} did not score 632 seats")
              r=v.get("reform",{})
              if sum(int(r.get(k,0)) for k in ("true_positive","false_positive","false_negative","true_negative"))!=632:
                  raise SystemExit(f"ERROR: invalid Reform confusion for {vid}: {r}")

          if sweep.get("best_development_variant") not in by_id:
              raise SystemExit("ERROR: best development variant is not in sweep")
          if any(x not in by_id for x in sweep.get("passing_variants",[])):
              raise SystemExit("ERROR: passing variant list contains unknown id")

          roles=diagnostic.get("feature_roles",{})
          outcomes=set(roles.get("outcomes_2024_only",[]))
          predictors=set(roles.get("predictors_ex_ante",[]))
          if outcomes!={"actual_ref_share","ref_share_error"} or predictors & outcomes:
              raise SystemExit(f"ERROR: diagnostic feature roles invalid {roles}")
          confusion=diagnostic.get("binary_confusion",{})
          if confusion.get("total")!=632:
              raise SystemExit("ERROR: canonical Reform diagnostic does not cover 632 seats")

          print("2019 regression guard: PASSED",observed_2019)
          print("2024 canonical regression guard: PASSED",observed_2024)
          print("2019 calibration:",calibration)
          print("STRUCTURAL SWEEP RESULTS")
          ranked=sorted(variants,key=lambda v:(v["metrics"]["correct_winners"],-v["metrics"]["seat_abs_error_sum"]),reverse=True)
          for v in ranked:
              m=v["metrics"]; r=v["reform"]
              print(
                  v["id"],
                  f"correct={m['correct_winners']}/632 ({m['winner_accuracy']:.2%})",
                  f"seat_error={m['seat_abs_error_sum']}",
                  f"REFseats={m['predicted_seats']['ref']}",
                  f"TP/FP/FN={r['true_positive']}/{r['false_positive']}/{r['false_negative']}",
                  f"gate={v['candidate_gate_passed']}",
              )
          print("Best 2024 development variant (NOT selected for live):",sweep.get("best_development_variant"))
          print("Variants clearing numerical gate (still NOT promotable):",sweep.get("passing_variants"))
          print("Dataset/model validation passed. v0.9.13 remains SHADOW RESEARCH ONLY.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.13 Reform structural sweep"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
