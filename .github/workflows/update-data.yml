name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and optimized map
        run: python tools/build_data.py

      - name: Calibrate and validate territorial model
        run: python tools/build_backtest.py

      - name: Validate datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          polls = json.loads(
              Path("data/polls.json").read_text(encoding="utf-8")
          )
          constituencies = json.loads(
              Path("data/constituencies-2024.json").read_text(encoding="utf-8")
          )
          geo = json.loads(
              Path("data/constituencies-2024.geojson").read_text(encoding="utf-8")
          )
          display_geo = json.loads(
              Path("data/constituencies-map.geojson").read_text(encoding="utf-8")
          )
          backtest = json.loads(
              Path("data/backtest-2024-territorial.json").read_text(encoding="utf-8")
          )
          params = json.loads(
              Path("data/model-params.json").read_text(encoding="utf-8")
          )

          n_polls = len(polls.get("polls", []))
          n_const = len(constituencies.get("constituencies", []))
          n_geo = len(geo.get("features", []))
          n_display = len(display_geo.get("features", []))

          full_path = Path("data/constituencies-2024.geojson")
          display_path = Path("data/constituencies-map.geojson")
          full_bytes = full_path.stat().st_size
          display_bytes = display_path.stat().st_size

          map_meta = display_geo.get("meta", {})
          vertices_before = int(map_meta.get("vertices_before", 0) or 0)
          vertices_after = int(map_meta.get("vertices_after", 0) or 0)

          validation = backtest.get("validation_2019", {})
          holdout = backtest.get("holdout_2024", {})
          common_holdout = holdout.get("common", {})
          fitted_holdout = holdout.get("fitted", {})

          print(f"Polls: {n_polls}")
          print(f"Constituencies: {n_const}")
          print(f"Full GeoJSON: {n_geo} features, {full_bytes:,} bytes")
          print(f"Display GeoJSON: {n_display} features, {display_bytes:,} bytes")
          print(f"Map vertices: {vertices_before:,} -> {vertices_after:,}")
          print(f"Live calibration approved: {params.get('approved')}")
          print(f"Fitted lambdas: {params.get('lambdas')}")
          print(f"2019 validation: {validation}")
          print(f"2024 holdout common: {common_holdout}")
          print(f"2024 holdout fitted: {fitted_holdout}")

          if n_polls < 10:
              raise SystemExit(f"ERROR: only {n_polls} polls")

          if n_const != 650:
              raise SystemExit(
                  f"ERROR: expected 650 constituencies, found {n_const}"
              )

          if n_geo < 650:
              raise SystemExit(
                  f"ERROR: expected at least 650 full geometries, found {n_geo}"
              )

          if n_display < 650:
              raise SystemExit(
                  f"ERROR: expected at least 650 display geometries, found {n_display}"
              )

          if display_bytes >= full_bytes:
              raise SystemExit(
                  "ERROR: optimized map is not smaller than full GeoJSON"
              )

          if vertices_before and vertices_after >= vertices_before:
              raise SystemExit(
                  "ERROR: optimized map did not reduce vertex count"
              )

          if common_holdout.get("gb_seats") != 632:
              raise SystemExit(
                  "ERROR: 2024 holdout did not evaluate 632 GB seats"
              )

          if params.get("version") != "uk-v04-historical-calibration":
              raise SystemExit(
                  f"ERROR: unexpected model params version: {params.get('version')}"
              )

          # approved=False is NOT an error: in that case app.js deliberately
          # falls back to the conservative lambda=0.82 model.
          print("Dataset validation passed.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data, optimized map and calibration"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
