name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.17 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.17 — remaining-error audit",
              "builder_integrity":"bes-integrity-v0917.json",
              "app":"uk-v0917-20260827-error-audit",
              "index":"Versione 0.9.17 · audit errori 2024",
          }
          observed={"builder":builder,"builder_integrity":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.17 (missing {needle!r})")
          print("v0.9.17 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.17 remaining-error audit
        run: python tools/build_mrp_lite.py

      - name: Validate v0.9.17 audit safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v0917.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0917-error-audit.json")
          audit=load("data/error-audit-v0917.json")
          reference=load("data/v0915-reference-v0917.json")

          n_polls=len(polls.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}
          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18: raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni: raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0917-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632: raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True: raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0917-error-audit",
              "live":"uk-v0917-error-audit-live",
              "backtest":"uk-v0917-error-audit-backtest",
              "audit":"uk-v0917-error-audit",
              "reference":"uk-v0917-error-audit",
          }
          observed_versions={"model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),"audit":audit.get("version"),"reference":reference.get("version")}
          if observed_versions!=expected_versions: raise SystemExit(f"ERROR: unexpected v0.9.17 versions {observed_versions}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("audit",audit),("reference",reference)):
              if payload.get("status")!="ok": raise SystemExit(f"ERROR: v0.9.17 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-error-audit-v11": raise SystemExit(f"ERROR: unexpected model type {mrp.get('model_type')}")
          if live.get("model_type")!="constituency-residual-error-audit-v11": raise SystemExit("ERROR: live shadow model type mismatch")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest)):
              if payload.get("shadow_only") is not True or payload.get("diagnostic_only") is not True: raise SystemExit(f"ERROR: {label} is not shadow diagnostic research")
              if payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False: raise SystemExit(f"ERROR: {label} claims to change canonical/production model")
          if mrp.get("approved") is not False or live.get("approved") is not False: raise SystemExit("ERROR: v0.9.17 audit cannot be approved")
          if mrp.get("publication_ready") is not False or live.get("publication_ready") is not False: raise SystemExit("ERROR: v0.9.17 audit cannot be publication-ready")

          strengths=mrp.get("selected_party_strengths") or {}
          required={"lab","con","ref","ld","green","snp","pc","other"}
          if not required.issubset(strengths): raise SystemExit(f"ERROR: incomplete party strengths {strengths}")
          routing=mrp.get("selected_incumbent_routing") or {}
          if abs(float(routing.get("route_strength") or 0))>1e-12 or abs(float(routing.get("unwind_strength") or 0))>1e-12:
              raise SystemExit(f"ERROR: rejected incumbent routing reactivated {routing}")

          # Canonical model is still frozen at the v0.9.10-equivalent candidate.
          val=mrp.get("validation_2019",{}).get("candidate",{});hold=mrp.get("holdout_2024",{}).get("candidate",{})
          expected_2019={"correct_winners":583,"seat_abs_error_sum":42};expected_2024={"correct_winners":494,"seat_abs_error_sum":176}
          if {k:val.get(k) for k in expected_2019}!=expected_2019: raise SystemExit(f"ERROR: v0.9.17 changed canonical 2019: {val}")
          if {k:hold.get(k) for k in expected_2024}!=expected_2024: raise SystemExit(f"ERROR: v0.9.17 changed canonical 2024: {hold}")
          if hold.get("predicted_seats",{}).get("ref")!=39 or hold.get("actual_seats",{}).get("ref")!=5: raise SystemExit("ERROR: canonical Reform regression guard failed")

          # v0.9.15 reference is frozen, not re-tuned.
          if reference.get("uses_2024_for_parameter_selection") is not False or reference.get("parameter_selection_election")!="2019":
              raise SystemExit("ERROR: v0.9.15 reference selection policy changed")
          if reference.get("reference_parameters")!={"local_strength":0.25,"confidence_floor":0.0,"margin_cap":None}:
              raise SystemExit(f"ERROR: v0.9.15 reference parameters changed {reference.get('reference_parameters')}")
          rv=reference.get("validation_2019",{});rh=reference.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: v0.9.15 reference 2019 not reproduced {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166: raise SystemExit(f"ERROR: v0.9.15 reference 2024 not reproduced {rh}")
          coverage=reference.get("coverage",{})
          c19=int(coverage.get("local_2019",{}).get("matched_seats") or 0);c24=int(coverage.get("local_2024",{}).get("matched_seats") or 0)
          if c19<300 or c24<300: raise SystemExit(f"ERROR: local-election coverage too low 2019={c19} 2024={c24}")
          for k in ("local_2019","local_2024","ons_2019","ons_2024"):
              if not isinstance(reference.get("sources",{}).get(k),dict): raise SystemExit(f"ERROR: missing source audit {k}")

          # Audit must describe exactly the 131 residual errors and select nothing.
          if audit.get("diagnostic_only") is not True or audit.get("used_for_parameter_selection") is not False:
              raise SystemExit("ERROR: audit role/leakage flags invalid")
          if audit.get("changes_production_model") is not False or audit.get("changes_candidate_model") is not False:
              raise SystemExit("ERROR: audit claims model changes")
          if audit.get("parameter_updates")!={}: raise SystemExit(f"ERROR: audit contains parameter updates {audit.get('parameter_updates')}")
          totals=audit.get("totals",{})
          expected_totals={"seats":632,"correct":501,"wrong":131,"target_80pct_correct":506,"minimum_net_recoveries_for_80pct":5}
          for k,v in expected_totals.items():
              if totals.get(k)!=v: raise SystemExit(f"ERROR: audit total {k} expected {v}, got {totals.get(k)}")
          wrong=audit.get("wrong_constituencies",[])
          if len(wrong)!=131 or len({x.get("id") for x in wrong})!=131: raise SystemExit("ERROR: remaining-error constituency list is incomplete/duplicated")
          impact=audit.get("local_strength_impact_vs_v0910",{})
          counts=impact.get("counts",{})
          fixed=int(counts.get("fixed_by_local_strength") or 0);broken=int(counts.get("broken_by_local_strength") or 0)
          if impact.get("net_correct_gain")!=7 or fixed-broken!=7:
              raise SystemExit(f"ERROR: v0.9.15 seat-level gain does not reconcile to +7: {impact}")
          if sum(int(v) for v in counts.values())!=632: raise SystemExit(f"ERROR: local-impact cohorts do not cover 632 seats {counts}")
          pairs=audit.get("confusion_pairs",[])
          if not pairs or sum(int(x.get("count") or 0) for x in pairs)!=131: raise SystemExit("ERROR: confusion pairs do not reconcile to 131 errors")
          if audit.get("largest_error_pair")!=pairs[0]: raise SystemExit("ERROR: largest error pair inconsistent with ranking")
          priorities=audit.get("priority_families_min5",[])
          if any(int(x.get("count") or 0)<5 for x in priorities): raise SystemExit("ERROR: priority-family threshold violated")
          if not isinstance(audit.get("party_share_error",{}).get("wrong_131"),dict): raise SystemExit("ERROR: missing party share-error audit")
          localerr=audit.get("local_profile_on_remaining_errors",{})
          if int(localerr.get("available") or 0)+int(localerr.get("missing") or 0)!=131: raise SystemExit("ERROR: local-profile error coverage does not reconcile")

          print("2019 canonical regression guard: PASSED",expected_2019)
          print("2024 canonical regression guard: PASSED",expected_2024)
          print("v0.9.15 reference: 2019",rv.get("correct_winners"),rv.get("seat_abs_error_sum"),"2024",rh.get("correct_winners"),rh.get("seat_abs_error_sum"))
          print("Local-election constituency coverage:",c19,c24)
          print("Remaining errors:",totals)
          print("Local-strength seat-level impact vs v0.9.10:",impact)
          print("Largest residual error pair:",audit.get("largest_error_pair"))
          print("Priority families >=5:",priorities[:20])
          print("Dataset/model validation passed. v0.9.17 remains AUDIT-ONLY SHADOW RESEARCH.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.17 error audit"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
