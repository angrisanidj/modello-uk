name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Build v0.9.9 scenario-aware calibration shadow model
        run: python tools/build_mrp_lite.py

      - name: Validate BES integrity and v0.9.9 scenario-aware gates
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v099.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v099-scenario-aware.json")

          n_polls=len(polls.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}

          print(f"National polls: {n_polls}")
          print(f"Constituencies: {n_const}")
          print(f"Legacy GB model: {params.get('version')} approved={params.get('approved')}")
          print(f"NI module: {ni.get('meta',{}).get('version')} seats={len(ni_seats)}")
          print(f"BES integrity: {integrity.get('status')}")
          print("BES integrity errors:", integrity.get("errors",[]))
          for check in integrity.get("checks",[]):
              print(
                  check.get("label"),
                  "countries=",check.get("countries"),
                  "regions=",check.get("english_regions"),
                  "winners=",check.get("winner_counts"),
                  "source=",check.get("share_source"),
                  "unknown_winner_labels=",check.get("unknown_winner_labels"),
                  "unknown_second_labels=",check.get("unknown_second_labels"),
              )

          if n_polls<10:
              raise SystemExit("ERROR: too few national polls")
          if n_const!=650:
              raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650:
              raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9:
              raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking":
              raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency":
              raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18:
              raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni:
              raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")

          # Unlike v0.9, parser integrity is a HARD deployment gate.
          if integrity.get("version")!="uk-v099-bes-integrity":
              raise SystemExit("ERROR: unexpected BES integrity version")
          if integrity.get("status")!="passed":
              raise SystemExit("ERROR: BES integrity failed: "+str(integrity.get("errors")))
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          if mrp.get("version")!="uk-v099-scenario-aware":
              raise SystemExit(f"ERROR: unexpected v0.9.9 model version {mrp.get('version')}")
          if live.get("version")!="uk-v099-scenario-aware-live":
              raise SystemExit(f"ERROR: unexpected v0.9.9 live version {live.get('version')}")
          if backtest.get("version")!="uk-v099-scenario-aware-backtest":
              raise SystemExit(
                  f"ERROR: unexpected v0.9.9 backtest version {backtest.get('version')}"
              )

          print(f"v0.9.9 status: {mrp.get('status')}")
          print(f"v0.9.9 approved: {mrp.get('approved')}")
          print(f"v0.9.9 publication_ready: {mrp.get('publication_ready')}")

          if mrp.get("status")=="ok":
              if mrp.get("model_type")!="constituency-residual-scenario-aware-v4":
                  raise SystemExit(f"ERROR: unexpected v0.9.9 model type {mrp.get('model_type')}")
              strengths=mrp.get("selected_party_strengths")
              if not isinstance(strengths,dict):
                  raise SystemExit("ERROR: missing party-specific FPTP strengths")
              required={"lab","con","ref","ld","green","snp","pc","other"}
              if not required.issubset(strengths):
                  raise SystemExit(f"ERROR: incomplete party strengths {strengths}")
              scenario=mrp.get("scenario_activation",{})
              if not isinstance(scenario.get("validation_2019"),dict):
                  raise SystemExit("ERROR: missing 2019 scenario activation audit")
              if not isinstance(scenario.get("benchmark_2024"),dict):
                  raise SystemExit("ERROR: missing 2024 scenario activation audit")
              print("2019 scenario activation:",scenario.get("validation_2019"))
              print("2024 scenario activation:",scenario.get("benchmark_2024"))
              val=mrp.get("validation_2019",{}).get("candidate",{})
              val_base=mrp.get("validation_2019",{}).get("baseline",{})
              hold=mrp.get("holdout_2024",{}).get("candidate",{})
              base=mrp.get("holdout_2024",{}).get("baseline",{})
              val_share=mrp.get("validation_2019",{}).get("share_only_candidate",{})
              hold_share=mrp.get("holdout_2024",{}).get("share_only_candidate",{})
              print("2019 baseline:",val_base)
              print("2019 share-only:",val_share)
              print("2019 FPTP candidate:",val)
              print("2024 baseline:",base)
              print("2024 share-only:",hold_share)
              print("2024 FPTP candidate:",hold)
              print("Selected share spec:",mrp.get("selected_spec"))
              print("Selected party strengths:",mrp.get("selected_party_strengths"))
              if val.get("gb_seats")!=632 or hold.get("gb_seats")!=632:
                  raise SystemExit("ERROR: v0.9.9 did not evaluate 632 GB seats")
              if val.get("winner_source")!="official_BES_WinnerXX" or hold.get("winner_source")!="official_BES_WinnerXX":
                  raise SystemExit("ERROR: v0.9.9 evaluation is not using official BES WinnerXX")
              if hold.get("other_prediction_rule")!="eligible_only_if_baseline_winner_or_runner_up":
                  raise SystemExit("ERROR: pooled Other is still being treated as a universal seat candidate")
              if mrp.get("approved"):
                  if float(hold.get("winner_accuracy",0))<.80:
                      raise SystemExit("ERROR: approved v0.9.9 below 80% holdout accuracy")
                  if len(live.get("seats",[]))!=632:
                      raise SystemExit("ERROR: approved v0.9.9 live file does not contain 632 GB seats")
              else:
                  print("v0.9.9 failed the model gate: production remains on fallback. This is VALID.")
          else:
              # Integrity passed, so an ML-only shadow failure may safely fall back.
              print("WARNING: v0.9.9 ML shadow build unavailable:",mrp.get("error"))
              print("Production remains on fallback.")

          print("Dataset/model validation passed.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.9 scenario-aware calibration"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
