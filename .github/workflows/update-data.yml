name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Democracy Club source cache
        uses: actions/cache@v4
        with:
          path: .cache/democracy-club
          key: dc-v0925-${{ runner.os }}-${{ hashFiles('tools/build_mrp_lite.py') }}
          restore-keys: |
            dc-v0925-${{ runner.os }}-
            dc-v0924-${{ runner.os }}-
            dc-v0923-${{ runner.os }}-
            dc-v0922-${{ runner.os }}-

      - name: Restore external MRP source cache
        uses: actions/cache@v4
        with:
          path: .cache/mrp-bridge
          key: mrp-bridge-v0925-${{ runner.os }}-${{ hashFiles('tools/build_mrp_geography_bridge.py') }}
          restore-keys: |
            mrp-bridge-v0925-${{ runner.os }}-
            mrp-bridge-v0924-${{ runner.os }}-
            mrp-bridge-v0923-${{ runner.os }}-

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.25 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          core=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          bridge=Path("tools/build_mrp_geography_bridge.py").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")

          required_core=[
              'V0922_HOTFIX="explicit-noop-candidate-fallback-and-traceback"',
              'V0922_HOTFIX_REGION_KEY="idempotent-region-key"',
              'V0922_HOTFIX_DC_IO="retry-memory-disk-cache"',
          ]
          required_bridge=[
              'V0925_BRIDGE="logspace-internal-to-external-geography-replacement"',
              'V0925_SELECTION="yougov-2019-only-blend-selection"',
              'V0925_LIVE_EVOLUTION="yougov24-anchor-plus-mic24-to-mic26-relative-shift"',
              'V0925_BASELINE="reconstruct-v0915-local-strength-both-elections"',
              'V0925_DIAGNOSTICS="full-zero-to-pure-external-blend-sweep-2024"',
              'YOUGOV_2019_URL=',
              'YOUGOV_2024_URL=',
              'MIC_2024_URL=',
              'MIC_2026_URL=',
              'uses_2024_for_parameter_selection":False',
          ]
          for needle in required_core:
              if needle not in core:
                  raise SystemExit(f"ERROR: v0.9.25 requires HOTFIX3 core; missing {needle!r}")
          for needle in required_bridge:
              if needle not in bridge:
                  raise SystemExit(f"ERROR: mixed/incomplete v0.9.25 bridge; missing {needle!r}")
          if "Build v0.9.25 MRP geography replacement/blend" not in workflow:
              raise SystemExit("ERROR: workflow is not the v0.9.25 geography-replacement/blend workflow")
          print("v0.9.25 source bundle preflight: PASSED")
          PY

      - name: Self-test v0.9.25 geography replacement/blend
        run: python tools/build_mrp_geography_bridge.py --self-test

      - name: Build v0.9.25 MRP geography replacement/blend
        run: python tools/build_mrp_geography_bridge.py

      - name: Validate v0.9.25 research safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          backtest=load("data/backtest-v0925-geography-bridge.json")
          diagnostic=load("data/mrp-geography-bridge-v0925.json")
          live=load("data/mrp-lite-live-v0925-shadow.json")
          integrity=load("data/bes-integrity-v0925.json")

          if backtest.get("version")!="uk-v0925-mrp-geography-bridge" or backtest.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.25 backtest {backtest.get('version')} {backtest.get('error')}")
          if diagnostic.get("version")!="uk-v0925-mrp-geography-bridge" or diagnostic.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.25 diagnostic {diagnostic.get('version')} {diagnostic.get('error')}")
          if live.get("version")!="uk-v0925-mrp-geography-bridge-live-shadow" or live.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.25 live shadow {live.get('version')} {live.get('error')}")

          if integrity.get("version")!="uk-v0925-bes-integrity-wrapper" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed: {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} has {check.get('gb_rows')} GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed party columns before NI filtering")

          # Methodological anti-leakage safeguards.
          for payload in (backtest,diagnostic,live):
              if payload.get("uses_2024_for_parameter_selection") is not False:
                  raise SystemExit("ERROR: 2024 leaked into v0.9.25 parameter selection")
              if payload.get("parameter_selection_election")!="2019":
                  raise SystemExit("ERROR: v0.9.25 strength was not selected on 2019")
              if payload.get("provider_topline_used") is not False:
                  raise SystemExit("ERROR: external provider topline entered the model")
              if payload.get("shadow_only") is not True or payload.get("publication_ready") is not False:
                  raise SystemExit("ERROR: v0.9.25 auto-promotion safeguard missing")

          ref=backtest.get("reference_v0915",{})
          rv=ref.get("validation_2019",{}); rh=ref.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: frozen v0.9.15 2019 reference changed {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166:
              raise SystemExit(f"ERROR: frozen v0.9.15 2024 reference changed {rh}")

          reconstructed=backtest.get("v0915_constituency_baseline_reconstruction",{})
          if reconstructed.get("status")!="passed":
              raise SystemExit(f"ERROR: v0.9.15 constituency baseline reconstruction missing/failed {reconstructed}")
          r19=reconstructed.get("validation_2019",{}); r24=reconstructed.get("benchmark_2024",{})
          if r19.get("correct_winners")!=585 or r19.get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: reconstructed 2019 v0.9.15 rows mismatch {r19}")
          if r24.get("correct_winners")!=501 or r24.get("seat_abs_error_sum")!=166:
              raise SystemExit(f"ERROR: reconstructed 2024 v0.9.15 rows mismatch {r24}")
          if backtest.get("corrected_v0915_baseline") is not True or backtest.get("zero_strength_invariant_passed") is not True:
              raise SystemExit("ERROR: corrected-baseline safeguards missing")

          selection=backtest.get("strength_selection_2019",{})
          candidates=selection.get("candidates",[])
          if len(candidates)!=9:
              raise SystemExit(f"ERROR: expected nine predeclared blend candidates, got {len(candidates)}")
          strengths=sorted(round(float(x.get("strength")) ,3) for x in candidates)
          expected_strengths=[0.0,0.125,0.25,0.375,0.5,0.625,0.75,0.875,1.0]
          if strengths!=expected_strengths:
              raise SystemExit(f"ERROR: unexpected replacement/blend grid {strengths}")
          if round(float(backtest.get("selected_strength")) ,3) not in strengths:
              raise SystemExit("ERROR: selected strength is outside the predeclared grid")
          zero19=next((x.get("metrics",{}) for x in candidates if abs(float(x.get("strength",-1)))<1e-12),None)
          if not zero19 or zero19.get("correct_winners")!=585 or zero19.get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: strength=0 does not reproduce v0.9.15 in 2019: {zero19}")

          bm=backtest.get("benchmark_2024",{})
          primary=bm.get("primary_yougov_anchor",{})
          if bm.get("provider_or_strength_selected_on_2024") is not False:
              raise SystemExit("ERROR: provider/strength was selected using 2024")
          if not isinstance(primary.get("correct_winners"),int) or primary.get("gb_seats")!=632:
              raise SystemExit(f"ERROR: incomplete primary 2024 score {primary}")
          full_sweep=bm.get("all_strengths_diagnostic",[])
          if len(full_sweep)!=27:
              raise SystemExit(f"ERROR: expected 27 diagnostic 2024 scores (3 providers x 9 blend strengths), got {len(full_sweep)}")
          provider_counts={}
          for row in full_sweep:
              provider_counts[row.get("provider")]=provider_counts.get(row.get("provider"),0)+1
              if row.get("selection_role")!="diagnostic_only":
                  raise SystemExit(f"ERROR: 2024 sweep row is not diagnostic-only {row}")
          if provider_counts!={"yougov":9,"more_in_common":9,"equal_provider_ensemble":9}:
              raise SystemExit(f"ERROR: unexpected 2024 diagnostic provider counts {provider_counts}")
          zero24=next((x.get("metrics",{}) for x in full_sweep if x.get("provider")=="yougov" and abs(float(x.get("strength",-1)))<1e-12),None)
          if not zero24 or zero24.get("correct_winners")!=501 or zero24.get("seat_abs_error_sum")!=166:
              raise SystemExit(f"ERROR: strength=0 does not reproduce v0.9.15 in 2024: {zero24}")
          architecture=diagnostic.get("architecture",{})
          formula=architecture.get("formula","")
          if "R_internal^(1-s)*R_external^s" not in formula:
              raise SystemExit(f"ERROR: v0.9.25 is not using true geography replacement/blend: {formula}")
          endpoints=architecture.get("endpoint_semantics",{})
          if "pure external" not in str(endpoints.get("strength_1","")).lower():
              raise SystemExit(f"ERROR: strength=1 pure-external endpoint not documented {endpoints}")
          pure=bm.get("pure_external_geography",{})
          if set(pure)!={"yougov","more_in_common","equal_provider_ensemble"}:
              raise SystemExit(f"ERROR: pure-external diagnostics incomplete {pure.keys()}")
          for provider,metrics in pure.items():
              if metrics.get("gb_seats")!=632 or not isinstance(metrics.get("correct_winners"),int):
                  raise SystemExit(f"ERROR: invalid pure-external diagnostic for {provider}: {metrics}")

          coverage=backtest.get("coverage",{})
          if int(coverage.get("yougov2019",{}).get("matched_seats",0))<630:
              raise SystemExit(f"ERROR: YouGov 2019 coverage too low {coverage.get('yougov2019')}")
          if int(coverage.get("yougov2024",{}).get("matched_seats",0))<620:
              raise SystemExit(f"ERROR: YouGov 2024 coverage too low {coverage.get('yougov2024')}")
          if int(coverage.get("mic2024",{}).get("matched_seats",0))<620:
              raise SystemExit(f"ERROR: MiC 2024 coverage too low {coverage.get('mic2024')}")

          # Gate booleans are audited rather than used to fail the Action.  A
          # scientifically negative experiment must still persist its result.
          val=selection.get("selected",{})
          expected_val=bool(val.get("correct_winners",0)>=585 and val.get("seat_abs_error_sum",10**9)<=42)
          expected_85=bool(primary.get("correct_winners",0)>=538 and primary.get("seat_abs_error_sum",10**9)<=166 and expected_val)
          expected_87=bool(primary.get("correct_winners",0)>=550 and primary.get("seat_abs_error_sum",10**9)<=150 and expected_val)
          expected_90=bool(primary.get("correct_winners",0)>=569 and primary.get("seat_abs_error_sum",10**9)<=130 and expected_val)
          if bool(backtest.get("validation_gate_passed"))!=expected_val:
              raise SystemExit("ERROR: validation gate boolean inconsistent")
          if bool(backtest.get("research_gate_85_passed"))!=expected_85:
              raise SystemExit("ERROR: 85% research gate boolean inconsistent")
          if bool(backtest.get("breakthrough_87_passed"))!=expected_87:
              raise SystemExit("ERROR: 87% breakthrough gate boolean inconsistent")
          if bool(backtest.get("stretch_90_passed"))!=expected_90:
              raise SystemExit("ERROR: 90% stretch gate boolean inconsistent")

          if live.get("applied_to_production") is not False or live.get("approved_for_live") is not False:
              raise SystemExit("ERROR: v0.9.25 live shadow was promoted automatically")
          if len(live.get("seats",[]))!=632:
              raise SystemExit(f"ERROR: live shadow has {len(live.get('seats',[]))} GB seats")

          mic26=live.get("live_geography",{}).get("status")
          if mic26 not in {"yougov24_plus_mic_evolution","static_yougov_2024_fallback"}:
              raise SystemExit(f"ERROR: unknown live geography status {mic26}")

          print("v0.9.15 reference: 2019 585/632 seat error 42; 2024 501/632 seat error 166")
          print("v0.9.25 selected strength:",backtest.get("selected_strength"))
          print("v0.9.25 validation 2019:",val.get("correct_winners"),"/632; seat error",val.get("seat_abs_error_sum"))
          print("v0.9.25 PRIMARY 2024:",primary.get("correct_winners"),"/632 =",round(100*primary.get("winner_accuracy",0),2),"%; seat error",primary.get("seat_abs_error_sum"))
          print("Diagnostic MiC 2024:",bm.get("diagnostic_mic_anchor",{}).get("correct_winners"),"/632")
          print("Diagnostic ensemble 2024:",bm.get("diagnostic_equal_provider_ensemble",{}).get("correct_winners"),"/632")
          for provider,best in bm.get("best_expost_by_provider",{}).items():
              mm=best.get("metrics",{})
              print("EX-POST DIAGNOSTIC ONLY",provider,"strength",best.get("strength"),":",mm.get("correct_winners"),"/632; seat error",mm.get("seat_abs_error_sum"))
          for provider,mm in bm.get("pure_external_geography",{}).items():
              print("PURE EXTERNAL GEOGRAPHY",provider,":",mm.get("correct_winners"),"/632; seat error",mm.get("seat_abs_error_sum"),"[DIAGNOSTIC]")
          print("GATES -> validation:",expected_val,"85%:",expected_85,"87%:",expected_87,"90%:",expected_90)
          print("Live geography:",mic26)
          print("Technical validation PASSED. Scientific gate outcome is persisted even when negative.")
          PY

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.25 MRP geography replacement blend"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
