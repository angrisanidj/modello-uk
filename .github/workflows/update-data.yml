name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test shadow MRP update watcher
        run: python tools/check_mrp_updates.py --self-test

      - name: Restore Democracy Club source cache
        uses: actions/cache@v4
        with:
          path: .cache/democracy-club
          key: dc-v0927-${{ runner.os }}-${{ hashFiles('tools/build_mrp_lite.py') }}
          restore-keys: |
            dc-v0927-${{ runner.os }}-
            dc-v0926-${{ runner.os }}-
            dc-v0925-${{ runner.os }}-
            dc-v0924-${{ runner.os }}-
            dc-v0923-${{ runner.os }}-
            dc-v0922-${{ runner.os }}-

      - name: Restore external MRP source cache
        uses: actions/cache@v4
        with:
          path: .cache/mrp-bridge
          key: mrp-bridge-v0927-${{ runner.os }}-${{ hashFiles('tools/build_mrp_geography_bridge.py') }}
          restore-keys: |
            mrp-bridge-v0927-${{ runner.os }}-
            mrp-bridge-v0926-${{ runner.os }}-
            mrp-bridge-v0925-${{ runner.os }}-
            mrp-bridge-v0924-${{ runner.os }}-
            mrp-bridge-v0923-${{ runner.os }}-

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Shadow-check for newer Westminster MRP
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          MRP_ALERT_TO: ${{ secrets.MRP_ALERT_TO }}
          MRP_ALERT_SMTP_USERNAME: ${{ secrets.MRP_ALERT_SMTP_USERNAME }}
          MRP_ALERT_SMTP_PASSWORD: ${{ secrets.MRP_ALERT_SMTP_PASSWORD }}
          MRP_ALERT_SMTP_HOST: ${{ secrets.MRP_ALERT_SMTP_HOST }}
          MRP_ALERT_SMTP_PORT: ${{ secrets.MRP_ALERT_SMTP_PORT }}
          MRP_ALERT_FROM: ${{ secrets.MRP_ALERT_FROM }}
          MRP_ALERT_SUBJECT_PREFIX: "[modello-UK]"
        run: python tools/check_mrp_updates.py --state data/mrp-update-watch.json

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.27 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path

          core=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          bridge=Path("tools/build_mrp_geography_bridge.py").read_text(encoding="utf-8")
          watcher=Path("tools/check_mrp_updates.py").read_text(encoding="utf-8")
          watch_state=Path("data/mrp-update-watch.json").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")

          required_core=[
              'V0922_HOTFIX="explicit-noop-candidate-fallback-and-traceback"',
              'V0922_HOTFIX_REGION_KEY="idempotent-region-key"',
              'V0922_HOTFIX_DC_IO="retry-memory-disk-cache"',
          ]
          required_bridge=[
              'V0927_BRIDGE="logspace-internal-to-external-geography-replacement"',
              'V0927_SELECTION="yougov-2019-only-blend-selection"',
              'V0927_LIVE_EVOLUTION="yougov24-anchor-plus-mic24-to-mic26-shrunk-relative-shift"',
              'V0927_TEMPORAL_TRANSFER="lambda-selected-on-2024-mrp-wave-movement-not-election-result"',
              'V0927_TEMPORAL_VALIDATION="train-2024-06-03-to-06-19-validate-06-19-to-07-03"',
              'V0927_PARSER_HOTFIX="mic26-leading-article-aliases-complete-header-selection"',
              'YOUGOV_2024_EARLY_URL=',
              'YOUGOV_2024_MID_URL=',
              'MIC_2024_EARLY_URL=',
              'MIC_2024_MID_URL=',
              'MIC_2026_URL=',
              'TEMPORAL_LAMBDA_GRID=',
              'uses_2024_for_parameter_selection":False',
          ]
          for needle in required_core:
              if needle not in core:
                  raise SystemExit(f"ERROR: v0.9.27 requires HOTFIX3 core; missing {needle!r}")
          for needle in required_bridge:
              if needle not in bridge:
                  raise SystemExit(f"ERROR: mixed/incomplete v0.9.27 bridge; missing {needle!r}")

          # The watcher itself is unchanged from the v0.9.26 shadow feature.
          required_watcher=[
              'V0926_MRP_WATCHER = "shadow-official-provider-discovery-one-shot-email"',
              'V0926_MRP_WATCHER_PROVIDERS = "more-in-common-yougov-focaldata"',
              'V0926_MRP_WATCHER_POLICY = "detect-and-notify-never-auto-adopt"',
          ]
          for needle in required_watcher:
              if needle not in watcher:
                  raise SystemExit(f"ERROR: shadow MRP watcher missing {needle!r}")
          for needle in (
              '"mode": "shadow_only"',
              '"baseline_date": "2026-07-19"',
              '"baseline_date": "2025-09-26"',
              '"baseline_date": "2025-02-03"',
          ):
              if needle not in watch_state:
                  raise SystemExit(f"ERROR: MRP watcher state is missing baseline marker {needle!r}")
          if "Build v0.9.27 calibrated temporal MRP geography" not in workflow:
              raise SystemExit("ERROR: workflow is not the v0.9.27 temporal-calibration workflow")
          if "Shadow-check for newer Westminster MRP" not in workflow:
              raise SystemExit("ERROR: shadow MRP watcher step missing from workflow")
          print("v0.9.27 source bundle + temporal calibration + shadow MRP watcher preflight: PASSED")
          PY

      - name: Self-test v0.9.27 calibrated temporal geography
        run: python tools/build_mrp_geography_bridge.py --self-test

      - name: Build v0.9.27 calibrated temporal MRP geography
        run: python tools/build_mrp_geography_bridge.py

      - name: Validate v0.9.27 backtest and temporal-live safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          backtest=load("data/backtest-v0927-geography-bridge.json")
          diagnostic=load("data/mrp-geography-bridge-v0927.json")
          live=load("data/mrp-lite-live-v0927-candidate.json")
          integrity=load("data/bes-integrity-v0927.json")

          if backtest.get("version")!="uk-v0927-mrp-geography-bridge" or backtest.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.27 backtest {backtest.get('version')} {backtest.get('error')}")
          if diagnostic.get("version")!="uk-v0927-mrp-geography-bridge" or diagnostic.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.27 diagnostic {diagnostic.get('version')} {diagnostic.get('error')}")
          if live.get("version")!="uk-v0927-mrp-geography-bridge-live-candidate" or live.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.27 live candidate {live.get('version')} {live.get('error')}")
          if integrity.get("version")!="uk-v0927-bes-integrity-wrapper" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed: {integrity.get('errors')}")

          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} has {check.get('gb_rows')} GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed party columns before NI filtering")

          # Frozen MRP-geography backtest must not regress while changing only
          # the live temporal updater.
          ref=backtest.get("reference_v0915",{})
          if ref.get("validation_2019",{}).get("correct_winners")!=585 or ref.get("validation_2019",{}).get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: frozen v0.9.15 2019 reference changed {ref.get('validation_2019')}")
          if ref.get("benchmark_2024",{}).get("correct_winners")!=501 or ref.get("benchmark_2024",{}).get("seat_abs_error_sum")!=166:
              raise SystemExit(f"ERROR: frozen v0.9.15 2024 reference changed {ref.get('benchmark_2024')}")

          selection=backtest.get("strength_selection_2019",{})
          val=selection.get("selected",{})
          primary=backtest.get("benchmark_2024",{}).get("primary_yougov_anchor",{})
          if val.get("correct_winners")!=609 or val.get("seat_abs_error_sum")!=14:
              raise SystemExit(f"ERROR: validated 2019 Geography Blend regressed {val}")
          if primary.get("correct_winners")!=578 or primary.get("seat_abs_error_sum")!=56:
              raise SystemExit(f"ERROR: validated 2024 Geography Blend regressed {primary}")
          if round(float(backtest.get("selected_strength",-1)),3)!=0.875:
              raise SystemExit(f"ERROR: historical geography strength changed {backtest.get('selected_strength')}")

          for payload in (backtest,diagnostic,live):
              if payload.get("uses_2024_for_parameter_selection") is not False:
                  raise SystemExit("ERROR: 2024 election result leaked into geography-strength selection")
              if payload.get("parameter_selection_election")!="2019":
                  raise SystemExit("ERROR: geography strength was not selected on 2019")
              if payload.get("provider_topline_used") is not False:
                  raise SystemExit("ERROR: external provider topline entered the model")
              if payload.get("approved_for_live") is not False or payload.get("publication_ready") is not False:
                  raise SystemExit("ERROR: v0.9.27 must remain unapproved pending temporal audit")
              if payload.get("temporal_lambda_selection_uses_election_result") is not False:
                  raise SystemExit("ERROR: realised election result entered temporal-lambda selection")

          temporal=backtest.get("temporal_transfer_calibration",{})
          if temporal.get("training_interval")!="2024-06-03/2024-06-19":
              raise SystemExit(f"ERROR: unexpected temporal training interval {temporal.get('training_interval')}")
          if temporal.get("validation_interval")!="2024-06-19/2024-07-03":
              raise SystemExit(f"ERROR: unexpected temporal validation interval {temporal.get('validation_interval')}")
          if temporal.get("uses_realised_2024_result_for_selection") is not False:
              raise SystemExit("ERROR: election outcome leaked into temporal transfer selection")
          candidates=temporal.get("training_candidates",[])
          expected=[0.0,0.125,0.25,0.375,0.5,0.625,0.75,0.875,1.0]
          got=sorted(round(float(x.get("lambda")) ,3) for x in candidates)
          if got!=expected:
              raise SystemExit(f"ERROR: temporal lambda grid changed {got}")
          temporal_lambda=round(float(temporal.get("selected_lambda",-1)),3)
          if temporal_lambda not in expected:
              raise SystemExit(f"ERROR: selected temporal lambda outside grid {temporal_lambda}")
          for key in ("validation_selected","validation_static_lambda_0","validation_raw_lambda_1"):
              m=temporal.get(key,{})
              if int(m.get("pairs",0))<1000 or not isinstance(m.get("mean_abs_log_error"),float):
                  raise SystemExit(f"ERROR: incomplete temporal movement validation {key}: {m}")
          replay=temporal.get("election_replay_2024",{})
          if replay.get("selection_role")!="validation_only_lambda_already_frozen" or replay.get("uses_result_for_lambda_selection") is not False:
              raise SystemExit(f"ERROR: invalid temporal election replay safeguards {replay}")
          for key in ("static_yougov_0619","calibrated_transfer","raw_full_transfer_lambda_1","final_yougov_0703","final_mic_0703"):
              if replay.get(key,{}).get("gb_seats")!=632:
                  raise SystemExit(f"ERROR: incomplete replay scenario {key}: {replay.get(key)}")

          coverage=backtest.get("coverage",{})
          for key,minimum in (
              ("yougov2019",630),("yougov2024_early",620),("yougov2024_mid",620),("yougov2024",620),
              ("mic2024_early",620),("mic2024_mid",620),("mic2024",620),("mic2026",620),
          ):
              if int(coverage.get(key,{}).get("matched_seats",0))<minimum:
                  raise SystemExit(f"ERROR: {key} coverage too low {coverage.get(key)}")

          source_meta=backtest.get("external_source_meta",{}).get("mic2026",{})
          mapped=source_meta.get("mapped_columns",{})
          required={"con","lab","ld","ref","green","snp","pc","other"}
          if set(mapped)!=required or float(source_meta.get("relative_national_share",{}).get("green",0))<=0.1:
              raise SystemExit(f"ERROR: MiC 2026 party geography incomplete {mapped}")

          live_geo=live.get("live_geography",{})
          if live_geo.get("status")!="yougov24_plus_calibrated_mic26_evolution":
              raise SystemExit(f"ERROR: calibrated 2026 geography not applied {live_geo}")
          if round(float(live_geo.get("temporal_lambda",-1)),3)!=temporal_lambda:
              raise SystemExit(f"ERROR: live temporal lambda differs from frozen calibration {live_geo}")
          if live.get("applied_to_production") is not False or live.get("approved_for_live") is not False:
              raise SystemExit("ERROR: v0.9.27 live candidate was promoted automatically")
          if len(live.get("seats",[]))!=632:
              raise SystemExit(f"ERROR: live candidate has {len(live.get('seats',[]))} seats")

          sensitivity=live.get("live_2026_sensitivity",{})
          if sensitivity.get("selection_role")!="diagnostic_only_no_2026_ground_truth":
              raise SystemExit(f"ERROR: live sensitivity role invalid {sensitivity}")
          for key in ("calibrated_primary_totals","full_evolution_lambda_1_totals","direct_mic26_totals","static_yougov24_totals"):
              totals=sensitivity.get(key,{})
              if sum(int(v) for v in totals.values())!=632:
                  raise SystemExit(f"ERROR: {key} does not sum to 632: {totals}")
          stability=sensitivity.get("stability_audit",{})
          if set(stability.get("scenario_names",[]))!={"calibrated_primary","full_evolution_lambda_1","direct_mic26","static_yougov24"}:
              raise SystemExit(f"ERROR: stability scenarios incomplete {stability.get('scenario_names')}")
          if int(stability.get("all_scenarios_agree",0))+int(stability.get("majority_consensus_available",0))<632:
              # majority_consensus includes all-agree seats, so this is deliberately
              # only a weak structural check; exact decomposition is printed below.
              pass

          print("v0.9.27 technical validation PASSED")
          print("Historical Geography Blend: 2019",val.get("correct_winners"),"/632 seat error",val.get("seat_abs_error_sum"),
                "| 2024",primary.get("correct_winners"),"/632 seat error",primary.get("seat_abs_error_sum"))
          print("Temporal lambda selected from MRP waves:",temporal_lambda)
          print("Temporal wave validation passed vs static:",temporal.get("validation_passed_vs_static"))
          print("Temporal validation mean log errors -> selected/static/raw:",
                temporal.get("validation_selected",{}).get("mean_abs_log_error"),
                temporal.get("validation_static_lambda_0",{}).get("mean_abs_log_error"),
                temporal.get("validation_raw_lambda_1",{}).get("mean_abs_log_error"))
          print("2024 frozen-lambda election replay -> static/calibrated/raw correct winners:",
                replay.get("static_yougov_0619",{}).get("correct_winners"),
                replay.get("calibrated_transfer",{}).get("correct_winners"),
                replay.get("raw_full_transfer_lambda_1",{}).get("correct_winners"),
                "passed:",replay.get("passed_vs_static"))
          print("2026 totals:",sensitivity.get("calibrated_primary_totals"))
          print("2026 changed winners vs calibrated primary:",sensitivity.get("changed_winners_vs_primary"))
          print("2026 pairwise stability:",stability.get("pairwise"))
          print("No live promotion performed.")
          PY

      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.27 calibrated temporal MRP geography"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
