name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.21 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.21 — Scotland STV local-residual validation",
              "builder_integrity":"bes-integrity-v0921.json",
              "app":"uk-v0921-20260827-scotland-local",
              "index":"Versione 0.9.21 · residui locali Scozia SNP/Labour (shadow)",
          }
          observed={"builder":builder,"builder_integrity":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.21 (missing {needle!r})")
          print("v0.9.21 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.21 Scotland local residual validation
        run: python tools/build_mrp_lite.py

      - name: Validate v0.9.21 shadow safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")
          integrity=load("data/bes-integrity-v0921.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0921-scotland-local-residual.json")
          sweep=load("data/scotland-local-residual-v0921.json")
          reference=load("data/v0915-reference-v0921.json")

          n_polls=len(polls.get("polls",[])); n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[]); ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}
          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18 or {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni: raise SystemExit(f"ERROR: NI regression failed {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0921-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632: raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True: raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0921-scotland-local-residual",
              "live":"uk-v0921-scotland-local-residual-live",
              "backtest":"uk-v0921-scotland-local-residual-backtest",
              "sweep":"uk-v0921-scotland-local-residual",
              "reference":"uk-v0921-scotland-local-residual",
          }
          observed={"model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),"sweep":sweep.get("version"),"reference":reference.get("version")}
          if observed!=expected_versions: raise SystemExit(f"ERROR: unexpected v0.9.21 versions {observed}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("sweep",sweep),("reference",reference)):
              if payload.get("status")!="ok": raise SystemExit(f"ERROR: v0.9.21 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-scotland-local-v15" or live.get("model_type")!="constituency-residual-scotland-local-v15":
              raise SystemExit("ERROR: unexpected v0.9.21 model type")
          for payload in (mrp,live):
              if payload.get("approved") is not False or payload.get("publication_ready") is not False: raise SystemExit("ERROR: v0.9.21 cannot be approved/publication-ready")
              if payload.get("shadow_only") is not True or payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False:
                  raise SystemExit("ERROR: v0.9.21 shadow safeguards missing")

          routing=mrp.get("selected_incumbent_routing",{})
          if float(routing.get("route_strength",-1))!=0.0 or float(routing.get("unwind_strength",-1))!=0.0:
              raise SystemExit(f"ERROR: incumbent routing no longer frozen at 0/0: {routing}")

          val=mrp.get("validation_2019",{}).get("candidate",{}); hold=mrp.get("holdout_2024",{}).get("candidate",{})
          if val.get("correct_winners")!=583 or val.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: canonical 2019 regression changed {val}")
          if hold.get("correct_winners")!=494 or hold.get("seat_abs_error_sum")!=176: raise SystemExit(f"ERROR: canonical 2024 regression changed {hold}")
          rv=reference.get("validation_2019",{}); rh=reference.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: v0.9.15 2019 reference changed {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166: raise SystemExit(f"ERROR: v0.9.15 2024 reference changed {rh}")

          if sweep.get("uses_2024_for_parameter_selection") is not False or sweep.get("parameter_selection_elections") != ["2015","2017","2019"]:
              raise SystemExit("ERROR: v0.9.21 leaks 2024 into parameter selection")
          if sweep.get("changes_production_model") is not False or sweep.get("changes_candidate_model") is not False:
              raise SystemExit("ERROR: v0.9.21 sweep metadata inconsistent")
          grid=sweep.get("grid",{})
          if grid.get("alpha") != [0.5,2.0,8.0,25.0]: raise SystemExit(f"ERROR: unexpected alpha grid {grid}")
          if grid.get("multiplier") != [0.0,0.5,0.75,1.0,1.25]: raise SystemExit(f"ERROR: unexpected multiplier grid {grid}")
          if grid.get("cap") != [3.0,5.0,7.0,9.0]: raise SystemExit(f"ERROR: unexpected cap grid {grid}")
          if sweep.get("candidate_count")!=65: raise SystemExit(f"ERROR: expected 65 Scotland candidates, got {sweep.get('candidate_count')}")
          if int(sweep.get("admissible_count") or 0)<1: raise SystemExit("ERROR: no admissible Scotland candidates")

          cov=sweep.get("coverage",{})
          for year in ("2015","2017","2019","2024"):
              if int(cov.get(year,{}).get("matched_seats") or 0)<45:
                  raise SystemExit(f"ERROR: Scotland {year} coverage too low {cov.get(year)}")
          src=sweep.get("sources",{}).get("scot_elex",{})
          usable=src.get("usable_wards",{})
          for y in ("2012","2017","2022"):
              # JSON object keys are strings after serialization.
              if int(usable.get(y,0))<300: raise SystemExit(f"ERROR: scot-elex {y} usable wards too low {usable}")

          selected=sweep.get("selected_historical",{}); sh=selected.get("benchmark_2024",{})
          if not selected.get("id") or not isinstance(sh.get("correct_winners"),int): raise SystemExit("ERROR: selected Scotland candidate incomplete")
          expected_gate=bool(sh.get("correct_winners",0)>=506 and sh.get("seat_abs_error_sum",10**9)<=166)
          if bool(selected.get("research_gate"))!=expected_gate: raise SystemExit(f"ERROR: Scotland research gate inconsistent {selected}")
          if live.get("scotland_local_residual",{}).get("applied_to_live") is not False: raise SystemExit("ERROR: Scotland residual layer was applied to live")

          diag=sweep.get("error_family_diagnostics",{})
          if diag.get("baseline_2024_snp_to_lab")!=12: raise SystemExit(f"ERROR: v0.9.17 SNP→Lab audit not reproduced {diag}")

          print("Canonical regression guard: 2019 583/42; 2024 494/176")
          print("v0.9.15 reference: 2019",rv.get("correct_winners"),rv.get("seat_abs_error_sum"),"2024",rh.get("correct_winners"),rh.get("seat_abs_error_sum"))
          print("Scotland selected on 2015/2017/2019 LOEO:",selected)
          print("Scotland error-family diagnostic:",diag)
          print("Scotland 2024 passing configs:",sweep.get("benchmark_2024_diagnostic",{}).get("passing_research_gate"))
          print("Dataset/model validation passed. v0.9.21 remains SHADOW RESEARCH regardless of 2024 result.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.21 Scotland local residual"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
