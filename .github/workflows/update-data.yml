
name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true
jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test shadow MRP update watcher
        run: python tools/check_mrp_updates.py --self-test
      - name: Restore Democracy Club source cache
        uses: actions/cache@v4
        with:
          path: .cache/democracy-club
          key: dc-v0929-${{ runner.os }}-${{ hashFiles('tools/build_mrp_lite.py') }}
          restore-keys: |
            dc-v0929-${{ runner.os }}-
            dc-v0928-${{ runner.os }}-
            dc-v0927-${{ runner.os }}-
            dc-v0926-${{ runner.os }}-
            dc-v0925-${{ runner.os }}-
            dc-v0924-${{ runner.os }}-
            dc-v0923-${{ runner.os }}-
            dc-v0922-${{ runner.os }}-
      - name: Restore external MRP source cache
        uses: actions/cache@v4
        with:
          path: .cache/mrp-bridge
          key: mrp-bridge-v0929-${{ runner.os }}-${{ hashFiles('tools/build_mrp_geography_bridge.py') }}
          restore-keys: |
            mrp-bridge-v0929-${{ runner.os }}-
            mrp-bridge-v0928-${{ runner.os }}-
            mrp-bridge-v0927-${{ runner.os }}-
            mrp-bridge-v0926-${{ runner.os }}-
            mrp-bridge-v0925-${{ runner.os }}-
            mrp-bridge-v0924-${{ runner.os }}-
            mrp-bridge-v0923-${{ runner.os }}-
      - name: Update election data and territorial inputs
        run: python tools/build_data.py
      - name: Shadow-check for newer Westminster MRP
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          MRP_ALERT_TO: ${{ secrets.MRP_ALERT_TO }}
          MRP_ALERT_SMTP_USERNAME: ${{ secrets.MRP_ALERT_SMTP_USERNAME }}
          MRP_ALERT_SMTP_PASSWORD: ${{ secrets.MRP_ALERT_SMTP_PASSWORD }}
          MRP_ALERT_SMTP_HOST: ${{ secrets.MRP_ALERT_SMTP_HOST }}
          MRP_ALERT_SMTP_PORT: ${{ secrets.MRP_ALERT_SMTP_PORT }}
          MRP_ALERT_FROM: ${{ secrets.MRP_ALERT_FROM }}
          MRP_ALERT_SUBJECT_PREFIX: "[modello-UK]"
        run: python tools/check_mrp_updates.py --state data/mrp-update-watch.json
      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.29 promotion source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          bridge=Path("tools/build_mrp_geography_bridge.py").read_text(encoding="utf-8")
          watcher=Path("tools/check_mrp_updates.py").read_text(encoding="utf-8")
          watch_state=Path("data/mrp-update-watch.json").read_text(encoding="utf-8")
          promotion=Path("tools/promote_mrp_stack.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          workflow=Path(".github/workflows/update-data.yml").read_text(encoding="utf-8")
          required_core=[
              'V0922_HOTFIX="explicit-noop-candidate-fallback-and-traceback"',
              'V0922_HOTFIX_REGION_KEY="idempotent-region-key"',
              'V0922_HOTFIX_DC_IO="retry-memory-disk-cache"',
          ]
          required_bridge=[
              'V0928_BRIDGE="logspace-internal-to-external-geography-replacement"',
              'V0928_SELECTION="yougov-2019-only-blend-selection"',
              'V0928_PROVIDER_STACK="party-precision-weighted-yougov24-plus-direct-mic26"',
              'V0928_STACK_SKILL="2024-relative-geography-error-variance-with-leave-region-out-validation"',
              'V0928_FRESHNESS="2019-to-2024-observed-geographic-drift-age-inflation"',
              'V0928_PARSER_HOTFIX="mic26-leading-article-aliases-complete-header-selection"',
              'def precision_stack_factors(',
              'def leave_region_out_stack(',
              'MIC_2026_URL=',
              'uses_2024_for_live_provider_reliability":True',
          ]
          for needle in required_core:
              if needle not in core:
                  raise SystemExit(f"ERROR: v0.9.28 requires HOTFIX3 core; missing {needle!r}")
          for needle in required_bridge:
              if needle not in bridge:
                  raise SystemExit(f"ERROR: mixed/incomplete frozen v0.9.28 bridge; missing {needle!r}")
          required_promotion=[
              'V0929_PROMOTION = "audited-v0928-precision-stack-to-production"',
              'V0929_MODEL_FREEZE = "no-statistical-retuning-during-promotion"',
              'V0929_PRODUCTION_SCHEMA = "precision-weighted-contemporary-mrp-geography-v1"',
              'MAX_CORE_CHANGED_WINNERS = 75',
              'def validate_candidate(',
              'def build_production(',
          ]
          for needle in required_promotion:
              if needle not in promotion:
                  raise SystemExit(f"ERROR: incomplete v0.9.29 promotion layer; missing {needle!r}")
          for needle in (
              "uk-v0929-precision-weighted-mrp-live",
              "precision-weighted-contemporary-mrp-geography-v1",
              "provider_stack_cv_2024_correct_winners",
          ):
              if needle not in app:
                  raise SystemExit(f"ERROR: app is not wired to v0.9.29 production model; missing {needle!r}")
          required_watcher=[
              'V0926_MRP_WATCHER = "shadow-official-provider-discovery-one-shot-email"',
              'V0926_MRP_WATCHER_PROVIDERS = "more-in-common-yougov-focaldata"',
              'V0926_MRP_WATCHER_POLICY = "detect-and-notify-never-auto-adopt"',
          ]
          for needle in required_watcher:
              if needle not in watcher:
                  raise SystemExit(f"ERROR: shadow MRP watcher missing {needle!r}")
          for needle in (
              '"mode": "shadow_only"',
              '"baseline_date": "2026-07-19"',
              '"baseline_date": "2025-09-26"',
              '"baseline_date": "2025-02-03"',
          ):
              if needle not in watch_state:
                  raise SystemExit(f"ERROR: MRP watcher state missing baseline marker {needle!r}")
          if "Build frozen v0.9.28 precision-weighted contemporary MRP candidate" not in workflow:
              raise SystemExit("ERROR: frozen v0.9.28 candidate build step missing")
          if "Promote audited stack to v0.9.29 production live" not in workflow:
              raise SystemExit("ERROR: v0.9.29 promotion step missing")
          if "Shadow-check for newer Westminster MRP" not in workflow:
              raise SystemExit("ERROR: shadow MRP watcher step missing")
          print("v0.9.29 promotion bundle + frozen v0.9.28 statistical engine + watcher preflight: PASSED")
          PY
      - name: Self-test frozen v0.9.28 precision stack
        run: python tools/build_mrp_geography_bridge.py --self-test

      - name: Self-test v0.9.29 production promotion
        run: python tools/promote_mrp_stack.py --self-test

      - name: Build frozen v0.9.28 precision-weighted contemporary MRP candidate
        run: python tools/build_mrp_geography_bridge.py
      - name: Validate frozen v0.9.28 historical model and candidate safeguards
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))
          backtest=load("data/backtest-v0928-geography-stack.json")
          diagnostic=load("data/mrp-geography-stack-v0928.json")
          live=load("data/mrp-lite-live-v0928-candidate.json")
          integrity=load("data/bes-integrity-v0928.json")
          if backtest.get("version")!="uk-v0928-mrp-geography-stack" or backtest.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.28 backtest {backtest.get('version')} {backtest.get('error')}")
          if diagnostic.get("version")!="uk-v0928-mrp-geography-stack" or diagnostic.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.28 diagnostic {diagnostic.get('version')} {diagnostic.get('error')}")
          if live.get("version")!="uk-v0928-mrp-geography-stack-live-candidate" or live.get("status")!="ok":
              raise SystemExit(f"ERROR: invalid v0.9.28 live candidate {live.get('version')} {live.get('error')}")
          if integrity.get("version")!="uk-v0928-bes-integrity-wrapper" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} has {check.get('gb_rows')} GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed parties before NI filtering")
          # Never allow the breakthrough historical model to regress while
          # experimenting with the separate 2026 provider stack.
          ref=backtest.get("reference_v0915",{})
          if ref.get("validation_2019",{}).get("correct_winners")!=585 or ref.get("validation_2019",{}).get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: frozen v0.9.15 2019 reference changed {ref.get('validation_2019')}")
          if ref.get("benchmark_2024",{}).get("correct_winners")!=501 or ref.get("benchmark_2024",{}).get("seat_abs_error_sum")!=166:
              raise SystemExit(f"ERROR: frozen v0.9.15 2024 reference changed {ref.get('benchmark_2024')}")
          val=backtest.get("strength_selection_2019",{}).get("selected",{})
          primary=backtest.get("benchmark_2024",{}).get("primary_yougov_anchor",{})
          if val.get("correct_winners")!=609 or val.get("seat_abs_error_sum")!=14:
              raise SystemExit(f"ERROR: validated 2019 Geography Blend regressed {val}")
          if primary.get("correct_winners")!=578 or primary.get("seat_abs_error_sum")!=56:
              raise SystemExit(f"ERROR: validated 2024 Geography Blend regressed {primary}")
          if round(float(backtest.get("selected_strength",-1)),3)!=0.875:
              raise SystemExit(f"ERROR: historical geography strength changed {backtest.get('selected_strength')}")
          for payload in (backtest,diagnostic,live):
              if payload.get("uses_2024_for_geography_strength_selection") is not False:
                  raise SystemExit("ERROR: 2024 leaked into historical geography-strength selection")
              if payload.get("uses_2024_for_live_provider_reliability") is not True:
                  raise SystemExit("ERROR: v0.9.28 must disclose 2024 historical training of live provider reliability")
              if payload.get("parameter_selection_election")!="2019":
                  raise SystemExit("ERROR: historical geography strength not selected on 2019")
              if payload.get("provider_topline_used") is not False:
                  raise SystemExit("ERROR: external provider topline entered model")
              if payload.get("approved_for_live") is not False or payload.get("publication_ready") is not False:
                  raise SystemExit("ERROR: v0.9.28 must remain unapproved")
          stack=backtest.get("live_provider_stack_training_2024",{})
          cv=stack.get("leave_one_region_out",{})
          cvm=cv.get("metrics",{})
          if cvm.get("gb_seats")!=632:
              raise SystemExit(f"ERROR: incomplete leave-region-out stack metrics {cvm}")
          if cv.get("uses_held_out_region_outcome_for_its_weights") is not False:
              raise SystemExit("ERROR: held-out region outcome leaked into its own provider weights")
          folds=cv.get("folds",[])
          if len(folds)<10 or sum(int(x.get("test_seats",0)) for x in folds)!=632:
              raise SystemExit(f"ERROR: invalid regional cross-validation folds {folds}")
          for provider_key in ("yougov2024","more_in_common2024"):
              err=stack.get("global_provider_measurement_error",{}).get(provider_key,{})
              if int(err.get("pairs",0))<1000 or set(err.get("variance",{}))!={"lab","con","ref","ld","green","snp","pc","other"}:
                  raise SystemExit(f"ERROR: incomplete provider error model {provider_key}: {err}")
          drift=stack.get("observed_geographic_drift_2019_to_2024",{})
          if int(drift.get("pairs",0))<1000 or set(drift.get("annual_variance",{}))!={"lab","con","ref","ld","green","snp","pc","other"}:
              raise SystemExit(f"ERROR: incomplete geographic drift model {drift}")
          coverage=backtest.get("coverage",{})
          for key,minimum in (
              ("yougov2019",630),("yougov2024_early",620),("yougov2024_mid",620),("yougov2024",620),
              ("mic2024_early",620),("mic2024_mid",620),("mic2024",620),("mic2026",620),
          ):
              if int(coverage.get(key,{}).get("matched_seats",0))<minimum:
                  raise SystemExit(f"ERROR: {key} coverage too low {coverage.get(key)}")
          micmeta=backtest.get("external_source_meta",{}).get("mic2026",{})
          required={"con","lab","ld","ref","green","snp","pc","other"}
          if set(micmeta.get("mapped_columns",{}))!=required or float(micmeta.get("relative_national_share",{}).get("green",0))<=0.1:
              raise SystemExit(f"ERROR: MiC 2026 party geography incomplete {micmeta.get('mapped_columns')}")
          live_geo=live.get("live_geography",{})
          if live_geo.get("status")!="precision_weighted_yougov24_plus_direct_mic26":
              raise SystemExit(f"ERROR: precision live geography not applied {live_geo}")
          weights=live_geo.get("current_provider_weights_by_party",{})
          if set(weights)!=required or any(not (0.0<=float(v)<=1.0) for v in weights.values()):
              raise SystemExit(f"ERROR: invalid live MiC precision weights {weights}")
          if live_geo.get("provider_toplines_used") is not False:
              raise SystemExit("ERROR: provider topline entered precision stack")
          if live.get("applied_to_production") is not False or live.get("approved_for_live") is not False:
              raise SystemExit("ERROR: v0.9.28 live candidate auto-promoted")
          if len(live.get("seats",[]))!=632:
              raise SystemExit(f"ERROR: live candidate has {len(live.get('seats',[]))} seats")
          sensitivity=live.get("live_2026_sensitivity",{})
          expected_totals=(
              "precision_freshness_primary_totals","skill_only_stack_totals","equal_provider_stack_totals",
              "direct_mic26_totals","static_yougov24_totals","legacy_full_temporal_transfer_totals",
          )
          for key in expected_totals:
              totals=sensitivity.get(key,{})
              if sum(int(v) for v in totals.values())!=632:
                  raise SystemExit(f"ERROR: {key} does not sum to 632 {totals}")
          stability=sensitivity.get("stability_audit",{})
          if len(stability.get("scenario_names",[]))!=6:
              raise SystemExit(f"ERROR: incomplete live sensitivity scenarios {stability.get('scenario_names')}")
          print("v0.9.28 technical validation PASSED")
          print("Historical Geography Blend: 2019",val.get("correct_winners"),"/632 seat error",val.get("seat_abs_error_sum"),
                "| 2024",primary.get("correct_winners"),"/632 seat error",primary.get("seat_abs_error_sum"))
          print("2024 leave-region-out provider stack:",cvm.get("correct_winners"),"/632 seat error",cvm.get("seat_abs_error_sum"),
                "passed no-regression gate:",cv.get("passes_no_regression_vs_yougov_anchor"))
          print("2026 MiC precision weights by party:",weights)
          print("2026 precision-stack totals:",sensitivity.get("precision_freshness_primary_totals"))
          print("2026 changed winners vs primary:",sensitivity.get("changed_winners_vs_primary"))
          print("Shadow candidate validation complete; promotion gate runs next.")
          PY
      - name: Promote audited stack to v0.9.29 production live
        run: python tools/promote_mrp_stack.py

      - name: Validate v0.9.29 production live
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          live=json.loads(Path("data/mrp-lite-live.json").read_text(encoding="utf-8"))
          candidate=json.loads(Path("data/mrp-lite-live-v0928-candidate.json").read_text(encoding="utf-8"))
          audit=json.loads(Path("data/promotion-audit-v0929.json").read_text(encoding="utf-8"))
          if audit.get("version")!="uk-v0929-production-promotion-audit" or audit.get("status")!="passed":
              raise SystemExit(f"ERROR: v0.9.29 promotion audit failed {audit}")
          if live.get("version")!="uk-v0929-precision-weighted-mrp-live":
              raise SystemExit(f"ERROR: wrong production version {live.get('version')}")
          if live.get("model_type")!="precision-weighted-contemporary-mrp-geography-v1":
              raise SystemExit(f"ERROR: wrong production schema {live.get('model_type')}")
          for key in ("approved","approved_for_live","publication_ready","applied_to_production"):
              if live.get(key) is not True:
                  raise SystemExit(f"ERROR: production approval flag {key} is not true")
          if live.get("shadow_only") is not False or live.get("live_candidate") is not False:
              raise SystemExit("ERROR: production file still marked shadow/candidate")
          if live.get("provider_topline_used") is not False:
              raise SystemExit("ERROR: provider topline entered production")
          if live.get("validation_2019_correct_winners")!=609 or live.get("validation_2019_seat_abs_error")!=14:
              raise SystemExit("ERROR: production 2019 validation metadata regressed")
          if live.get("provider_stack_cv_2024_correct_winners")!=584 or live.get("provider_stack_cv_2024_seat_abs_error")!=44:
              raise SystemExit("ERROR: production provider-stack CV metadata regressed")
          if len(live.get("seats",[]))!=632:
              raise SystemExit("ERROR: production live does not contain 632 GB seats")
          if live.get("seats")!=candidate.get("seats"):
              raise SystemExit("ERROR: promotion layer mutated constituency projections")
          if live.get("target_gb")!=candidate.get("target_gb"):
              raise SystemExit("ERROR: promotion layer mutated internal national target")
          gates=audit.get("gates",{})
          if gates.get("core_2026_stability_passed") is not True:
              raise SystemExit(f"ERROR: production stability gate failed {gates}")
          print("v0.9.29 PRODUCTION LIVE validation PASSED")
          print("2019 609/632 · 2024 YouGov benchmark 578/632 · 2024 provider-stack LORO 584/632")
          print("2026 central GB totals:",live.get("totals"))
          print("Core 2026 changed winners:",gates.get("core_2026_changed_winners_vs_primary"))
          PY
      - name: Commit refreshed data
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.29 production MRP stack"
            git push
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
