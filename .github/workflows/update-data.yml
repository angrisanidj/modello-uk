name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Calibrate partial national raking
        run: python tools/build_backtest.py

      - name: Validate datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          backtest=load("data/backtest-2024-territorial.json")
          params=load("data/model-params.json")
          sub_path=Path("data/subnational-polls.json")
          sub=load(sub_path) if sub_path.exists() else {"polls":[]}

          n_polls=len(polls.get("polls",[]))
          n_sub=len(sub.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          n_geo=len(geo.get("features",[]))
          n_display=len(display.get("features",[]))
          regions=territorial.get("english_regions",[])

          baseline=backtest.get("baseline_common",{})
          candidate=backtest.get("partial_raking_candidate",{})
          val=candidate.get("validation_2019",{})
          hold=candidate.get("holdout_2024",{})
          alpha=params.get("rake_strength")

          print(f"National polls: {n_polls}")
          print(f"Subnational polls: {n_sub}")
          print(f"Constituencies: {n_const}")
          print(f"English regions: {regions}")
          print(f"Model version: {params.get('version')}")
          print(f"Model type: {params.get('model_type')}")
          print(f"Selected rake alpha: {alpha}")
          print(f"Partial-raking model approved: {params.get('approved')}")
          print(f"2019 candidate: accuracy={val.get('winner_accuracy')} seat_error={val.get('seat_abs_error_sum')}")
          print(f"2024 candidate: accuracy={hold.get('winner_accuracy')} seat_error={hold.get('seat_abs_error_sum')}")
          print(f"2019 baseline: {baseline.get('validation_2019',{})}")
          print(f"2024 baseline: {baseline.get('holdout_2024',{})}")

          if n_polls < 10:
              raise SystemExit(f"ERROR: only {n_polls} national polls")
          if n_const != 650:
              raise SystemExit(f"ERROR: expected 650 constituencies, found {n_const}")
          if n_geo < 650 or n_display < 650:
              raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions) != 9:
              raise SystemExit(f"ERROR: expected 9 English regions, found {regions}")
          if params.get("version") != "uk-v07-partial-raking":
              raise SystemExit(f"ERROR: unexpected model version {params.get('version')}")
          if params.get("model_type") != "partial-raked-v1":
              raise SystemExit(f"ERROR: unexpected model type {params.get('model_type')}")
          if not isinstance(alpha,(int,float)) or not (0 <= alpha <= 1):
              raise SystemExit(f"ERROR: invalid rake strength {alpha}")
          if baseline.get("holdout_2024",{}).get("gb_seats") != 632:
              raise SystemExit("ERROR: baseline holdout did not evaluate 632 GB seats")
          if val.get("gb_seats") != 632 or hold.get("gb_seats") != 632:
              raise SystemExit("ERROR: partial-raking validation/holdout did not evaluate 632 GB seats")
          if len(candidate.get("alpha_grid_training",[])) != 41:
              raise SystemExit("ERROR: incomplete alpha training grid")

          # approved=False is valid. The browser then keeps the conservative
          # fallback rather than silently publishing an inferior candidate.
          print("Dataset validation passed.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and partial-raking calibration"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
