name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.22 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.22 — unified solution search",
              "builder_version":"uk-v0922-solution-search",
              "builder_integrity":"bes-integrity-v0922.json",
              "builder_hotfix":"V0922_HOTFIX=\"explicit-noop-candidate-fallback-and-traceback\"",
              "app":"uk-v0922-20260827-unified-solution-search",
              "index":"Versione 0.9.22 · solution search unificata (shadow)",
          }
          observed={"builder":builder,"builder_version":builder,"builder_integrity":builder,"builder_hotfix":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.22 (missing {needle!r})")
          print("v0.9.22 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.22 unified solution search
        run: python tools/build_mrp_lite.py

      - name: Validate v0.9.22 shadow safeguards and unified solution search
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")
          integrity=load("data/bes-integrity-v0922.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0922-solution-search.json")
          solution=load("data/solution-search-v0922.json")
          reference=load("data/v0915-reference-v0922.json")

          n_polls=len(polls.get("polls",[])); n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[]); ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}
          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18 or {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni: raise SystemExit(f"ERROR: NI regression failed {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0922-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632: raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True: raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0922-solution-search",
              "live":"uk-v0922-solution-search-live",
              "backtest":"uk-v0922-solution-search-backtest",
              "solution":"uk-v0922-solution-search",
              "reference":"uk-v0922-solution-search",
          }
          observed={"model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),"solution":solution.get("version"),"reference":reference.get("version")}
          if observed!=expected_versions: raise SystemExit(f"ERROR: unexpected v0.9.22 versions {observed}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("solution",solution),("reference",reference)):
              if payload.get("status")!="ok": raise SystemExit(f"ERROR: v0.9.22 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-solution-search-v16" or live.get("model_type")!="constituency-residual-solution-search-v16":
              raise SystemExit("ERROR: unexpected v0.9.22 model type")
          for payload in (mrp,live):
              if payload.get("approved") is not False or payload.get("publication_ready") is not False: raise SystemExit("ERROR: v0.9.22 cannot auto-approve")
              if payload.get("shadow_only") is not True or payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False:
                  raise SystemExit("ERROR: v0.9.22 shadow safeguards missing")

          routing=mrp.get("selected_incumbent_routing",{})
          if float(routing.get("route_strength",-1))!=0.0 or float(routing.get("unwind_strength",-1))!=0.0:
              raise SystemExit(f"ERROR: incumbent routing no longer frozen at 0/0: {routing}")

          val=mrp.get("validation_2019",{}).get("candidate",{}); hold=mrp.get("holdout_2024",{}).get("candidate",{})
          if val.get("correct_winners")!=583 or val.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: canonical 2019 regression changed {val}")
          if hold.get("correct_winners")!=494 or hold.get("seat_abs_error_sum")!=176: raise SystemExit(f"ERROR: canonical 2024 regression changed {hold}")
          rv=reference.get("validation_2019",{}); rh=reference.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: v0.9.15 2019 reference changed {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166: raise SystemExit(f"ERROR: v0.9.15 2024 reference changed {rh}")

          if solution.get("uses_2024_for_parameter_selection") is not False or solution.get("parameter_selection_elections") != ["2015","2017","2019"]:
              raise SystemExit("ERROR: v0.9.22 leaks 2024 into parameter selection")
          if solution.get("shadow_only") is not True or solution.get("diagnostic_only") is not True:
              raise SystemExit("ERROR: v0.9.22 solution metadata inconsistent")

          if solution.get("solution_schema")!="unified_nation_brexit_v2":
              raise SystemExit(f"ERROR: unified solution schema missing: {solution.get('solution_schema')}")
          sc=solution.get("scotland_signal",{}); country=solution.get("country_split",{}); brx=solution.get("brexit_geography",{}); tg=solution.get("public_target_lists",{}); meta=solution.get("winner_meta",{})
          if sc.get("candidate_count")!=15: raise SystemExit(f"ERROR: expected 15 Scotland candidates, got {sc.get('candidate_count')}")
          if country.get("candidate_count")!=15: raise SystemExit(f"ERROR: expected 15 country-split candidates, got {country.get('candidate_count')}")
          if tg.get("candidate_count")!=36: raise SystemExit(f"ERROR: expected 36 public-target candidates, got {tg.get('candidate_count')}")
          if meta.get("candidate_count")!=16: raise SystemExit(f"ERROR: expected 16 winner-meta candidates, got {meta.get('candidate_count')}")
          cal=brx.get("calibration",{})
          if cal.get("candidate_count")!=24: raise SystemExit(f"ERROR: expected 24 Brexit-geometry CV candidates, got {cal.get('candidate_count')}")
          if int(cal.get("training_seats",0))<150: raise SystemExit(f"ERROR: too few Brexit 2019 calibration seats: {cal.get('training_seats')}")
          if cal.get("uses_2024") is not False: raise SystemExit("ERROR: Brexit geography calibration leaks 2024")
          if int(brx.get("seat_profile",{}).get("matched_seats",0))<350: raise SystemExit(f"ERROR: Brexit EU geography coverage too low: {brx.get('seat_profile')}")
          for label,branch in (("Scotland",sc),("country",country),("targets",tg),("meta",meta)):
              selected=branch.get("selected_historical") if label!="meta" else branch.get("selected_pre2024")
              if not isinstance(selected,dict) or not selected.get("id"):
                  raise SystemExit(f"ERROR: {label} has no pre-2024 selected candidate")

          combined=solution.get("combined_selected_pre2024",{})
          bm=combined.get("benchmark_2024",{})
          if not isinstance(bm.get("correct_winners"),int) or not isinstance(bm.get("seat_abs_error_sum"),int):
              raise SystemExit(f"ERROR: combined 2024 benchmark incomplete {bm}")
          expected_gate=bool(bm.get("correct_winners",0)>=506 and bm.get("seat_abs_error_sum",10**9)<=166)
          if bool(combined.get("research_gate"))!=expected_gate:
              raise SystemExit(f"ERROR: solution research gate inconsistent {combined}")
          if live.get("solution_search",{}).get("applied_to_live") is not False:
              raise SystemExit("ERROR: solution-search layers were applied to live")
          if bool(mrp.get("solution_research_gate_passed"))!=expected_gate:
              raise SystemExit("ERROR: model/solution gate mismatch")

          print("Canonical regression guard: 2019 583/42; 2024 494/176")
          print("v0.9.15 reference: 2019",rv.get("correct_winners"),rv.get("seat_abs_error_sum"),"2024",rh.get("correct_winners"),rh.get("seat_abs_error_sum"))
          print("Selected Scotland signal:",sc.get("selected_historical"))
          print("Selected country-split signal:",country.get("selected_historical"))
          print("Brexit/Farage calibration:",cal)
          print("Selected public-target signal:",tg.get("selected_historical"))
          print("Selected winner meta:",meta.get("selected_pre2024"))
          print("Combined pre-2024 solution -> 2024:",bm)
          if expected_gate:
              print("SOLUTION RESEARCH GATE PASSED: >=506/632 and seat error <=166. Still shadow-only in v0.9.22.")
          else:
              print("Solution research gate not passed; v0.9.15 remains the best defensible shadow reference.")
          print("Dataset/model validation passed. v0.9.22 remains SHADOW RESEARCH regardless of result.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.22 unified solution search"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
