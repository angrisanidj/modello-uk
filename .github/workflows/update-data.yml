name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Calibrate transfer and competition model
        run: python tools/build_backtest.py

      - name: Validate datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          backtest=load("data/backtest-2024-territorial.json")
          params=load("data/model-params.json")
          sub_path=Path("data/subnational-polls.json")
          sub=load(sub_path) if sub_path.exists() else {"polls":[]}

          n_polls=len(polls.get("polls",[]))
          n_sub=len(sub.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          n_geo=len(geo.get("features",[]))
          n_display=len(display.get("features",[]))
          regions=territorial.get("english_regions",[])
          groups=territorial.get("groups",{})

          baseline_holdout=backtest.get("baseline_common",{}).get("holdout_2024",{})
          transfer=backtest.get("transfer_candidate",{})
          transfer_val=transfer.get("validation_2019",{})
          transfer_hold=transfer.get("holdout_2024",{})
          coeff=params.get("transfer_coefficients",{})
          feature_parties=params.get("transfer_feature_parties",[])
          target_parties=params.get("transfer_target_parties",[])

          print(f"National polls: {n_polls}")
          print(f"Subnational polls: {n_sub}")
          print(f"Constituencies: {n_const}")
          print(f"English regions: {regions}")
          print(f"Model version: {params.get('version')}")
          print(f"Model type: {params.get('model_type')}")
          print(f"Transfer model approved: {params.get('approved')}")
          print(f"Transfer ridge: {params.get('transfer_ridge')}")
          print(f"2019 transfer validation: {transfer_val}")
          print(f"2024 transfer holdout: {transfer_hold}")

          if n_polls < 10:
              raise SystemExit(f"ERROR: only {n_polls} national polls")
          if n_const != 650:
              raise SystemExit(f"ERROR: expected 650 constituencies, found {n_const}")
          if n_geo < 650 or n_display < 650:
              raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions) != 9:
              raise SystemExit(f"ERROR: expected 9 English regions, found {regions}")
          if params.get("version") != "uk-v06-transfer-raked":
              raise SystemExit(f"ERROR: unexpected model version {params.get('version')}")
          if params.get("model_type") != "transfer-raked-v1":
              raise SystemExit(f"ERROR: unexpected model type {params.get('model_type')}")
          if baseline_holdout.get("gb_seats") != 632:
              raise SystemExit("ERROR: baseline 2024 holdout did not evaluate 632 GB seats")
          if transfer_val.get("gb_seats") != 632 or transfer_hold.get("gb_seats") != 632:
              raise SystemExit("ERROR: transfer validation/holdout did not evaluate 632 GB seats")
          if len(feature_parties) != 7 or len(target_parties) != 8:
              raise SystemExit("ERROR: unexpected transfer party dimensions")
          if set(coeff) != set(target_parties):
              raise SystemExit("ERROR: transfer coefficient target rows incomplete")
          for target,row in coeff.items():
              if set(row) != set(feature_parties):
                  raise SystemExit(f"ERROR: coefficient row {target} has wrong source columns")

          # approved=False is deliberately valid: app.js then uses the old
          # conservative fallback rather than publishing an inferior candidate.
          print("Dataset validation passed.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and transfer calibration"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

