name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.14 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.14 — place + regradient structural sweep",
              "builder_integrity":"bes-integrity-v0914.json",
              "app":"uk-v0914-20260826-place-regradient-sweep",
              "index":"Versione 0.9.14 · place + regradient sweep",
          }
          observed={"builder":builder,"builder_integrity":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.14 (missing {needle!r})")
          print("v0.9.14 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.14 place + regradient sweep (shadow research)
        run: python tools/build_mrp_lite.py

      - name: Validate BES integrity and v0.9.14 safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v0914.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0914-place-regradient.json")
          errors=load("data/error-structure-v0914.json")
          sweep=load("data/place-regradient-sweep-v0914.json")

          n_polls=len(polls.get("polls",[]))
          n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[])
          ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}

          if n_polls<10:
              raise SystemExit("ERROR: too few national polls")
          if n_const!=650:
              raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650:
              raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9:
              raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking":
              raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency":
              raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18:
              raise SystemExit(f"ERROR: expected 18 NI seats, got {len(ni_seats)}")
          if {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni:
              raise SystemExit(f"ERROR: NI winner check failed: {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0914-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632:
                  raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True:
                  raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0914-place-regradient-sweep",
              "live":"uk-v0914-place-regradient-sweep-live",
              "backtest":"uk-v0914-place-regradient-sweep-backtest",
              "errors":"uk-v0914-place-regradient-sweep",
              "sweep":"uk-v0914-place-regradient-sweep",
          }
          observed_versions={
              "model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),
              "errors":errors.get("version"),"sweep":sweep.get("version"),
          }
          if observed_versions!=expected_versions:
              raise SystemExit(f"ERROR: unexpected v0.9.14 versions {observed_versions}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("errors",errors),("sweep",sweep)):
              if payload.get("status")!="ok":
                  raise SystemExit(f"ERROR: v0.9.14 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-place-regradient-sweep-v8":
              raise SystemExit(f"ERROR: unexpected model type {mrp.get('model_type')}")
          if live.get("model_type")!="constituency-residual-place-regradient-sweep-v8":
              raise SystemExit("ERROR: live shadow model type mismatch")

          # v0.9.14 cannot alter the canonical/live candidate.  It only researches
          # post-calibration layers and publishes their backtest diagnostics.
          for label,payload in (("model",mrp),("live",live),("backtest",backtest)):
              if payload.get("shadow_only") is not True or payload.get("diagnostic_only") is not True:
                  raise SystemExit(f"ERROR: {label} is not shadow diagnostic research")
              if payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False:
                  raise SystemExit(f"ERROR: {label} claims to change the canonical/production model")
          if mrp.get("approved") is not False or live.get("approved") is not False:
              raise SystemExit("ERROR: v0.9.14 shadow research cannot be approved")
          if mrp.get("publication_ready") is not False or live.get("publication_ready") is not False:
              raise SystemExit("ERROR: v0.9.14 shadow research cannot be publication-ready")

          strengths=mrp.get("selected_party_strengths") or {}
          required={"lab","con","ref","ld","green","snp","pc","other"}
          if not required.issubset(strengths):
              raise SystemExit(f"ERROR: incomplete party strengths {strengths}")
          routing=mrp.get("selected_incumbent_routing") or {}
          if abs(float(routing.get("route_strength") or 0))>1e-12 or abs(float(routing.get("unwind_strength") or 0))>1e-12:
              raise SystemExit(f"ERROR: rejected incumbent routing reactivated {routing}")

          # Hard freeze: the experiment must not change the model we are diagnosing.
          val=mrp.get("validation_2019",{}).get("candidate",{})
          hold=mrp.get("holdout_2024",{}).get("candidate",{})
          expected_2019={"correct_winners":583,"seat_abs_error_sum":42}
          expected_2024={"correct_winners":494,"seat_abs_error_sum":176}
          if {k:val.get(k) for k in expected_2019}!=expected_2019:
              raise SystemExit(f"ERROR: v0.9.14 changed canonical 2019: {val}")
          if {k:hold.get(k) for k in expected_2024}!=expected_2024:
              raise SystemExit(f"ERROR: v0.9.14 changed canonical 2024: {hold}")
          if hold.get("predicted_seats",{}).get("ref")!=39 or hold.get("actual_seats",{}).get("ref")!=5:
              raise SystemExit("ERROR: canonical Reform regression guard failed")

          # Full canonical error audit must exactly reconcile with 494/632.
          if errors.get("total_seats")!=632 or errors.get("wrong_seats")!=138 or errors.get("correct_seats")!=494:
              raise SystemExit(f"ERROR: incomplete error-structure audit {errors.get('total_seats')} {errors.get('wrong_seats')} {errors.get('correct_seats')}")
          if len(errors.get("wrong_constituencies",[]))!=138:
              raise SystemExit("ERROR: wrong constituency list does not contain 138 cases")
          if not errors.get("confusion_pairs"):
              raise SystemExit("ERROR: error confusion matrix is empty")

          # The new grid is fixed in source and selected ONLY on 2019.
          if sweep.get("uses_2024_for_parameter_selection") is not False:
              raise SystemExit("ERROR: v0.9.14 sweep leaks 2024 into parameter selection")
          if sweep.get("parameter_selection_election")!="2019":
              raise SystemExit(f"ERROR: unexpected parameter selection election {sweep.get('parameter_selection_election')}")
          if sweep.get("candidate_count")!=54:
              raise SystemExit(f"ERROR: expected 54 fixed structural candidates, got {sweep.get('candidate_count')}")
          baseline=sweep.get("baseline",{})
          if baseline.get("validation_2019",{}).get("correct_winners")!=583 or baseline.get("validation_2019",{}).get("seat_abs_error_sum")!=42:
              raise SystemExit(f"ERROR: sweep 2019 baseline mismatch {baseline.get('validation_2019')}")
          if baseline.get("benchmark_2024",{}).get("correct_winners")!=494 or baseline.get("benchmark_2024",{}).get("seat_abs_error_sum")!=176:
              raise SystemExit(f"ERROR: sweep 2024 baseline mismatch {baseline.get('benchmark_2024')}")

          selected=sweep.get("selected_pre2024",{})
          sv=selected.get("validation_2019",{}); sh=selected.get("benchmark_2024",{})
          if sv.get("gb_seats")!=632 or sh.get("gb_seats")!=632:
              raise SystemExit("ERROR: selected structural candidate was not scored on all 632 GB seats")
          # Since the zero-strength canonical is in the grid, 2019 selection may not
          # choose a strictly worse result than the canonical under the score order.
          if int(sv.get("correct_winners") or 0)<583:
              raise SystemExit(f"ERROR: 2019-only selector chose a lower-accuracy candidate {sv}")
          if int(sv.get("correct_winners") or 0)==583 and int(sv.get("seat_abs_error_sum") or 999)>42:
              raise SystemExit(f"ERROR: 2019-only selector lost the tie-break against canonical {sv}")

          shortlist=sweep.get("benchmark_2024_pre2024_shortlist",{}).get("candidates",[])
          if len(shortlist)!=12:
              raise SystemExit(f"ERROR: expected 12 pre-2024 shortlisted candidates, got {len(shortlist)}")
          if shortlist[0].get("id")!=selected.get("id"):
              raise SystemExit("ERROR: selected candidate is not rank 1 of pre-2024 shortlist")
          if any(x.get("benchmark_2024",{}).get("gb_seats")!=632 for x in shortlist):
              raise SystemExit("ERROR: incomplete 2024 benchmark in pre-2024 shortlist")

          print("2019 canonical regression guard: PASSED",expected_2019)
          print("2024 canonical regression guard: PASSED",expected_2024)
          print("Largest canonical 2024 error pair:",errors.get("largest_error_pair"))
          print("Canonical regional errors:",errors.get("regions"))
          print("v0.9.14 selected on 2019 ONLY:",selected.get("id"))
          print("Selected 2019:",sv)
          print("Selected 2024 score-only benchmark:",sh)
          print("Selected research gate (>=506 correct and seat error <=176):",selected.get("research_gate"))
          print("PRE-2024 SHORTLIST -> 2024 SCORE-ONLY")
          for x in shortlist:
              vm=x["validation_2019"]; hm=x["benchmark_2024"]
              print(
                  x["pre2024_rank"],x["id"],
                  f"2019={vm['correct_winners']}/632 err={vm['seat_abs_error_sum']}",
                  f"2024={hm['correct_winners']}/632 ({hm['winner_accuracy']:.2%}) err={hm['seat_abs_error_sum']}",
                  f"seats={hm['predicted_seats']}",
                  f"gate={x['research_gate']}",
              )
          print("Research-gate passers in pre-2024 shortlist:",sweep.get("benchmark_2024_pre2024_shortlist",{}).get("passing_research_gate",[]))
          print("Dataset/model validation passed. v0.9.14 remains SHADOW RESEARCH ONLY.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.14 place regradient sweep"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
