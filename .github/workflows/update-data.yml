name: Update and deploy UK model

on:
  workflow_dispatch:
  schedule:
    - cron: "15 5 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: uk-model-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update election data and territorial inputs
        run: python tools/build_data.py

      - name: Build Northern Ireland module
        run: python tools/build_ni.py

      - name: Calibrate legacy partial-raking benchmark
        run: python tools/build_backtest.py

      - name: Verify v0.9.18 source bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          builder=Path("tools/build_mrp_lite.py").read_text(encoding="utf-8")
          app=Path("scripts/app.js").read_text(encoding="utf-8")
          index=Path("index.html").read_text(encoding="utf-8")
          required={
              "builder":"modello-uk v0.9.18 — Liberal Democrat target-seat concentration sweep",
              "builder_integrity":"bes-integrity-v0918.json",
              "app":"uk-v0918-20260827-ld-target",
              "index":"Versione 0.9.18 · targeting Liberal Democrats",
          }
          observed={"builder":builder,"builder_integrity":builder,"app":app,"index":index}
          for key,needle in required.items():
              if needle not in observed[key]:
                  raise SystemExit(f"ERROR: mixed-version upload: {key} is not v0.9.18 (missing {needle!r})")
          print("v0.9.18 source bundle preflight: PASSED")
          PY

      - name: Build v0.9.18 Liberal Democrat target sweep
        run: python tools/build_mrp_lite.py

      - name: Validate v0.9.18 shadow safeguards
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          def load(path):
              return json.loads(Path(path).read_text(encoding="utf-8"))

          polls=load("data/polls.json")
          constituencies=load("data/constituencies-2024.json")
          territorial=load("data/territorial-baseline.json")
          geo=load("data/constituencies-2024.geojson")
          display=load("data/constituencies-map.geojson")
          params=load("data/model-params.json")
          ni=load("data/ni-2024.json")

          integrity=load("data/bes-integrity-v0918.json")
          mrp=load("data/mrp-lite-model.json")
          live=load("data/mrp-lite-live.json")
          backtest=load("data/backtest-v0918-ld-target.json")
          sweep=load("data/ld-target-sweep-v0918.json")
          reference=load("data/v0915-reference-v0918.json")

          n_polls=len(polls.get("polls",[])); n_const=len(constituencies.get("constituencies",[]))
          regions=territorial.get("english_regions",[]); ni_seats=ni.get("constituencies",[])
          ni_winners=Counter(s.get("winner2024") for s in ni_seats)
          expected_ni={"sf":7,"dup":5,"sdlp":2,"alliance":1,"uup":1,"tuv":1,"ind":1}
          if n_polls<10: raise SystemExit("ERROR: too few national polls")
          if n_const!=650: raise SystemExit(f"ERROR: expected 650 constituencies, got {n_const}")
          if len(geo.get("features",[]))<650 or len(display.get("features",[]))<650: raise SystemExit("ERROR: geometry feature count below 650")
          if len(regions)!=9: raise SystemExit(f"ERROR: expected 9 English regions, got {regions}")
          if params.get("version")!="uk-v07-partial-raking": raise SystemExit(f"ERROR: unexpected legacy GB model version {params.get('version')}")
          if ni.get("meta",{}).get("version")!="uk-v08-ni-constituency": raise SystemExit("ERROR: unexpected NI module version")
          if len(ni_seats)!=18 or {k:ni_winners.get(k,0) for k in expected_ni}!=expected_ni: raise SystemExit(f"ERROR: NI regression failed {dict(ni_winners)}")

          if integrity.get("version")!="uk-v0918-bes-integrity" or integrity.get("status")!="passed":
              raise SystemExit(f"ERROR: BES integrity failed/version mismatch: {integrity.get('version')} {integrity.get('errors')}")
          for check in integrity.get("checks",[]):
              if check.get("gb_rows")!=632: raise SystemExit(f"ERROR: {check.get('label')} does not contain exactly 632 GB rows")
              if check.get("ni_filtered_before_party_parsing") is not True: raise SystemExit(f"ERROR: {check.get('label')} parsed parties before filtering NI")

          expected_versions={
              "model":"uk-v0918-ld-target-sweep",
              "live":"uk-v0918-ld-target-sweep-live",
              "backtest":"uk-v0918-ld-target-sweep-backtest",
              "sweep":"uk-v0918-ld-target-sweep",
              "reference":"uk-v0918-ld-target-sweep",
          }
          observed={"model":mrp.get("version"),"live":live.get("version"),"backtest":backtest.get("version"),"sweep":sweep.get("version"),"reference":reference.get("version")}
          if observed!=expected_versions: raise SystemExit(f"ERROR: unexpected v0.9.18 versions {observed}")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest),("sweep",sweep),("reference",reference)):
              if payload.get("status")!="ok": raise SystemExit(f"ERROR: v0.9.18 {label} build failed: {payload.get('error')}")

          if mrp.get("model_type")!="constituency-residual-ld-target-v12" or live.get("model_type")!="constituency-residual-ld-target-v12":
              raise SystemExit("ERROR: unexpected v0.9.18 model type")
          for label,payload in (("model",mrp),("live",live),("backtest",backtest)):
              if payload.get("shadow_only") is not True or payload.get("diagnostic_only") is not True: raise SystemExit(f"ERROR: {label} is not shadow research")
              if payload.get("changes_production_model") is not False or payload.get("changes_candidate_model") is not False: raise SystemExit(f"ERROR: {label} claims to change canonical/production model")
          if mrp.get("approved") is not False or live.get("approved") is not False: raise SystemExit("ERROR: v0.9.18 cannot be approved")
          if mrp.get("publication_ready") is not False or live.get("publication_ready") is not False: raise SystemExit("ERROR: v0.9.18 cannot be publication-ready")

          routing=mrp.get("selected_incumbent_routing") or {}
          if abs(float(routing.get("route_strength") or 0))>1e-12 or abs(float(routing.get("unwind_strength") or 0))>1e-12:
              raise SystemExit(f"ERROR: rejected incumbent routing reactivated {routing}")

          # Canonical regression is still v0.9.10-equivalent.
          val=mrp.get("validation_2019",{}).get("candidate",{}); hold=mrp.get("holdout_2024",{}).get("candidate",{})
          if val.get("correct_winners")!=583 or val.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: canonical 2019 changed {val}")
          if hold.get("correct_winners")!=494 or hold.get("seat_abs_error_sum")!=176: raise SystemExit(f"ERROR: canonical 2024 changed {hold}")
          if hold.get("predicted_seats",{}).get("ref")!=39 or hold.get("actual_seats",{}).get("ref")!=5: raise SystemExit("ERROR: canonical Reform guard failed")

          # Frozen v0.9.15 reference must be exact.
          if reference.get("uses_2024_for_parameter_selection") is not False or reference.get("parameter_selection_election")!="2019": raise SystemExit("ERROR: v0.9.15 reference policy changed")
          if reference.get("reference_parameters")!={"local_strength":0.25,"confidence_floor":0.0,"margin_cap":None}: raise SystemExit(f"ERROR: v0.9.15 reference parameters changed {reference.get('reference_parameters')}")
          rv=reference.get("validation_2019",{}); rh=reference.get("benchmark_2024",{})
          if rv.get("correct_winners")!=585 or rv.get("seat_abs_error_sum")!=42: raise SystemExit(f"ERROR: v0.9.15 2019 not reproduced {rv}")
          if rh.get("correct_winners")!=501 or rh.get("seat_abs_error_sum")!=166: raise SystemExit(f"ERROR: v0.9.15 2024 not reproduced {rh}")
          coverage=reference.get("coverage",{}); c19=int(coverage.get("local_2019",{}).get("matched_seats") or 0); c24=int(coverage.get("local_2024",{}).get("matched_seats") or 0)
          if c19<300 or c24<300: raise SystemExit(f"ERROR: local-election coverage too low 2019={c19} 2024={c24}")

          # LD target sweep may select only on 2019.
          if sweep.get("uses_2024_for_parameter_selection") is not False or sweep.get("parameter_selection_election")!="2019": raise SystemExit("ERROR: LD sweep leaks 2024 into selection")
          if sweep.get("used_for_parameter_selection") is not True: raise SystemExit("ERROR: LD sweep must explicitly identify 2019 parameter selection")
          if sweep.get("changes_production_model") is not False or sweep.get("changes_candidate_model") is not False: raise SystemExit("ERROR: LD sweep claims production changes")
          grid=sweep.get("grid",{})
          if grid.get("strength")!=[0.0,0.1,0.15,0.2,0.25,0.3,0.4,0.5,0.65,0.8]: raise SystemExit(f"ERROR: unexpected strength grid {grid}")
          if grid.get("score_floor")!=[0.35,0.5,0.65] or sweep.get("candidate_count")!=30: raise SystemExit(f"ERROR: unexpected LD grid/candidate count {grid} {sweep.get('candidate_count')}")
          exclusions=set(sweep.get("score_exclusions",[]))
          if "region" not in exclusions or "2024 realised winner" not in exclusions or "2024 realised shares" not in exclusions: raise SystemExit(f"ERROR: missing anti-overfit score exclusions {exclusions}")
          selected=sweep.get("selected_pre2024",{}); sv=selected.get("validation_2019",{}); sh=selected.get("benchmark_2024",{})
          if not selected.get("id") or selected.get("strength") not in grid["strength"] or selected.get("score_floor") not in grid["score_floor"]: raise SystemExit(f"ERROR: selected LD config outside fixed grid {selected}")
          if not isinstance(sv.get("correct_winners"),int) or not isinstance(sh.get("correct_winners"),int): raise SystemExit("ERROR: missing LD sweep metrics")
          ranking=sweep.get("pre2024_validation_ranking",[]); bench=sweep.get("benchmark_2024_diagnostic",{}).get("ranking",[])
          if len(ranking)!=30 or len(bench)!=30: raise SystemExit("ERROR: incomplete LD rankings")
          if ranking[0].get("id")!=selected.get("id"): raise SystemExit("ERROR: selected LD config is not top 2019-ranked candidate")
          base=sweep.get("baseline_reference",{})
          if base.get("validation_2019",{}).get("correct_winners")!=585 or base.get("benchmark_2024",{}).get("correct_winners")!=501: raise SystemExit(f"ERROR: sweep baseline is not v0.9.15 {base}")
          passed=bool(selected.get("research_gate"))
          expected_pass=bool(sh.get("correct_winners",0)>=506 and sh.get("seat_abs_error_sum",10**9)<=166)
          if passed!=expected_pass: raise SystemExit(f"ERROR: research gate inconsistent selected={selected}")
          if live.get("ld_target_experiment",{}).get("applied_to_live") is not False: raise SystemExit("ERROR: LD audit-inspired layer was applied to live")

          print("Canonical regression guard: 2019 583/42; 2024 494/176")
          print("v0.9.15 reference: 2019",rv.get("correct_winners"),rv.get("seat_abs_error_sum"),"2024",rh.get("correct_winners"),rh.get("seat_abs_error_sum"))
          print("LD target selected on 2019:",selected.get("id"),sv.get("correct_winners"),sv.get("seat_abs_error_sum"))
          print("LD target 2024 benchmark:",sh.get("correct_winners"),sh.get("winner_accuracy"),sh.get("seat_abs_error_sum"),sh.get("predicted_seats"))
          print("Best 2024 ex-post diagnostic:",sweep.get("benchmark_2024_diagnostic",{}).get("best_expost"))
          print("Passing 2024 research-gate configs:",sweep.get("benchmark_2024_diagnostic",{}).get("passing_research_gate"))
          print("Dataset/model validation passed. v0.9.18 remains SHADOW RESEARCH regardless of 2024 result.")
          PY

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/; then
            echo "No data changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore: update UK data and v0.9.18 LD target sweep"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
